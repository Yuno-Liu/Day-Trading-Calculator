<title>台股當沖・融資融券計算機</title>
<script>
  // manifest 只在 http/https 掛上：WebKit 以 CORS 抓 manifest，file://（origin null）會在主控台報錯
  if (location.protocol === 'http:' || location.protocol === 'https:') {
    var manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = 'manifest.webmanifest';
    document.head.appendChild(manifestLink);
  }
</script>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@8.1.1/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  // 主畫面 App（舊版 iOS 以 navigator.standalone 判斷）：提早加上 class，避免版面跳動
  try {
    if (window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)) {
      document.documentElement.classList.add('is-standalone');
    }
  } catch (e) { /* 忽略 */ }
  if (window.tailwind) {
    window.tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: 'var(--canvas)',
            card: 'var(--card)',
            'card-2': 'var(--card-2)',
            fill: 'var(--fill)',
            ink: 'var(--ink)',
            'ink-2': 'var(--ink-2)',
            'ink-3': 'var(--ink-3)',
            line: 'var(--line)',
            gain: 'var(--gain)',
            loss: 'var(--loss)',
            accent: 'var(--accent)',
            warn: 'var(--warn)',
            danger: 'var(--danger)',
          },
          fontFamily: {
            sans: ['system-ui', '-apple-system', '"PingFang TC"', '"Noto Sans TC"', '"Microsoft JhengHei"', 'sans-serif'],
          },
        },
      },
    };
  }
</script>
<style>
  /* ── 設計 token（亮色） ─────────────────────────────────────────── */
  :root {
    color-scheme: light dark;
    --canvas: #f2f2f7;
    --card: #ffffff;
    --card-2: #f6f6f9;
    --fill: #ececf0;
    --fill-press: #dedee4;
    --seg-ind: #ffffff;
    --ink: #111114;
    --ink-2: #46464d;
    --ink-3: #5f5f66;
    --line: #dcdce2;
    --gain: #cc0018;
    --loss: #0a7a33;
    --accent: #0055d4;
    --accent-fill: #0055d4;
    --accent-tint: #e8f0ff;
    --warn: #8a4f00;
    --warn-tint: #fff4dd;
    --danger: #b3261e;
    --danger-tint: #fdecea;
    --hl: #fff6d6;
    --hl-edge: #d9a400;
    --shadow: 0 1px 2px rgba(17, 17, 20, 0.06), 0 2px 8px rgba(17, 17, 20, 0.04);
    --seg-shadow: 0 1px 3px rgba(0, 0, 0, 0.12), 0 1px 1px rgba(0, 0, 0, 0.04);
    --scrim: rgba(0, 0, 0, 0.36);
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    --font: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  /* ── 設計 token（深色） ─────────────────────────────────────────── */
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #000000;
      --card: #1c1c1e;
      --card-2: #242427;
      --fill: #313134;
      --fill-press: #3d3d41;
      --seg-ind: #5a5a5f;
      --ink: #f5f5f7;
      --ink-2: #cfcfd4;
      --ink-3: #a7a7ae;
      --line: #38383c;
      --gain: #ff6961;
      --loss: #3ddc68;
      --accent: #5aa9ff;
      --accent-fill: #1a64d6; /* 實心按鈕底色：白字對比 ≥4.5:1（#5aa9ff 上白字只有 2.46:1） */
      --accent-tint: #132744;
      --warn: #ffb84d;
      --warn-tint: #33260d;
      --danger: #ff8f85;
      --danger-tint: #3a1715;
      --hl: #33290f;
      --hl-edge: #d9a400;
      --shadow: none;
      --seg-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      --scrim: rgba(0, 0, 0, 0.6);
    }
  }

  /* ── 基礎（不依賴 Tailwind，避免 FOUC） ───────────────────────────── */
  html { background-color: var(--canvas); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    /* 聚焦／錨點捲動時避開黏性頁首與底部摘要列 */
    scroll-padding-top: calc(64px + var(--sat)); scroll-padding-bottom: calc(96px + var(--sab)); }
  @media (min-width: 1024px) { html { scroll-padding-top: 16px; scroll-padding-bottom: 16px; } }
  body {
    margin: 0;
    min-height: 100dvh;
    background-color: var(--canvas);
    color: var(--ink);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.45;
    letter-spacing: 0;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }
  #root { min-height: 100dvh; }
  button, input, select, textarea { font-family: inherit; color: inherit; }
  button, label, [role="button"] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  input, select, textarea { font-size: max(16px, 1em); }
  [hidden] { display: none !important; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .c-gain { color: var(--gain); }
  .c-loss { color: var(--loss); }
  .c-flat { color: var(--ink); }
  .c-ink2 { color: var(--ink-2); }
  .c-ink3 { color: var(--ink-3); }
  .c-warn { color: var(--warn); }
  .c-danger { color: var(--danger); }
  .c-accent { color: var(--accent); }

  /* ── 載入骨架 ─────────────────────────────────────────────────── */
  .boot { max-width: 560px; margin: 0 auto; padding: calc(24px + var(--sat)) max(16px, var(--sar)) 24px max(16px, var(--sal)); }
  .boot-title { margin: 32px 0 8px; font-size: 28px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; }
  .boot-msg { margin: 0 0 20px; font-size: 15px; color: var(--ink-2); }
  .boot-card { height: 148px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); margin-bottom: 12px; animation: boot-pulse 1.4s ease-in-out infinite alternate; }
  @keyframes boot-pulse { from { opacity: 1; } to { opacity: 0.55; } }
  .boot.is-failed .boot-card { display: none; }
  @media (prefers-reduced-motion: reduce) { .boot-card { animation: none; } }

  /* ── 主畫面 App：狀態列實色底板（iOS 27 模糊 workaround） ───────────── */
  .status-plate { display: none; }
  @media (display-mode: standalone) {
    .status-plate { display: block; position: fixed; top: 0; left: 0; right: 0; height: max(env(safe-area-inset-top), 6px); background: var(--canvas); z-index: 60; }
  }
  html.is-standalone .status-plate { display: block; position: fixed; top: 0; left: 0; right: 0; height: max(env(safe-area-inset-top), 6px); background: var(--canvas); z-index: 60; }

  /* ── 版面 ─────────────────────────────────────────────────────── */
  .shell { min-height: 100dvh; padding-top: var(--sat); }
  .gutter { padding-left: max(16px, var(--sal)); padding-right: max(16px, var(--sar)); }
  @media (min-width: 1024px) { .gutter { padding-left: max(32px, var(--sal)); padding-right: max(32px, var(--sar)); } }
  .page-bottom { padding-bottom: calc(112px + var(--sab)); }
  @media (min-width: 1024px) { .page-bottom { padding-bottom: 48px; } }

  /* ── 頁首（捲動後才套玻璃） ─────────────────────────────────────── */
  .app-header { position: sticky; top: var(--sat); z-index: 40; }
  .app-header::before {
    content: ""; position: absolute; inset: 0; opacity: 0; pointer-events: none;
    background: var(--card);
    border-bottom: 0.5px solid var(--line);
    transition: opacity 200ms ease;
  }
  .app-header.is-scrolled::before { opacity: 1; }
  .bar { position: relative; display: flex; align-items: center; gap: 8px; min-height: 52px; }
  .bar-title { flex: 1 1 auto; min-width: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transform: translateY(4px); transition: opacity 200ms ease, transform 200ms var(--ease); }
  .app-header.is-scrolled .bar-title { opacity: 1; transform: none; }
  @media (min-width: 1024px) {
    .app-header { position: relative; top: 0; }
    .app-header::before { display: none; }
    .bar-title { visibility: hidden; }
  }

  /* 玻璃材質：只用在浮動控制層（頁首捲動後、底部摘要列）；不支援時為實色 */
  .glass { background-color: var(--card); }
  @supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) and (background: color-mix(in srgb, red 50%, transparent)) {
    .app-header::before, .glass {
      background-color: color-mix(in srgb, var(--card) 72%, transparent);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(20px) saturate(180%);
    }
  }
  @media (prefers-reduced-transparency: reduce) {
    .app-header::before, .glass { background: var(--card) !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
  }

  /* ── 字級 ─────────────────────────────────────────────────────── */
  .large-title { margin: 0; font-size: clamp(26px, 7vw, 34px); line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
  .subtitle { margin: 6px 0 0; font-size: 15px; line-height: 1.4; color: var(--ink-2); }
  .title2 { margin: 0; font-size: 22px; line-height: 1.25; font-weight: 700; letter-spacing: -0.015em; }
  .headline { margin: 0; font-size: 17px; line-height: 1.3; font-weight: 600; letter-spacing: -0.01em; }
  .footnote { font-size: 13px; line-height: 1.45; color: var(--ink-2); }
  p { text-wrap: pretty; }

  /* ── 卡片（內容層：不透明） ──────────────────────────────────────── */
  .card { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); min-width: 0; }
  .card-pad { padding: 16px; }
  @media (min-width: 1024px) { .card-pad { padding: 20px; } }
  .card-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .card-title > * { min-width: 0; }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: 0; }

  /* ── 按壓回饋 ─────────────────────────────────────────────────── */
  .press { position: relative; -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: transform 100ms ease-out, opacity 100ms ease-out, background-color 100ms ease-out; }
  .press:active:not(:disabled) { transform: scale(0.97); }
  .row-press { position: relative; -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: background-color 100ms ease-out; }
  .row-press:active { background-color: var(--fill) !important; }
  @media (prefers-reduced-motion: reduce) {
    .press { transition: opacity 100ms linear; }
    .press:active:not(:disabled) { transform: none; opacity: 0.6; }
  }

  /* 觸覺回饋：真實點擊 label → 切換隱藏的 switch（iOS 漸進增強） */
  .haptic { position: absolute; inset: 0; z-index: 2; border-radius: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  .haptic-switch { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; margin: 0; padding: 0; border: 0; opacity: 0; overflow: hidden; pointer-events: none; }

  /* ── 按鈕 ─────────────────────────────────────────────────────── */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 44px; padding: 0 16px; border-radius: 12px; font-size: 16px; font-weight: 600; line-height: 1.2; border: 0; cursor: pointer; text-align: center; }
  .btn:disabled { cursor: default; opacity: 1; color: var(--ink-3); background: var(--fill); }
  .btn-gray { background: var(--fill); color: var(--ink); }
  .btn-tinted { background: var(--accent-tint); color: var(--accent); }
  .btn-filled { background: var(--accent-fill); color: #fff; }
  .btn-danger { background: var(--danger-tint); color: var(--danger); }
  .btn-plain { background: transparent; color: var(--accent); padding: 0 10px; }
  .btn-sm { min-height: 44px; padding: 0 12px; font-size: 15px; border-radius: 10px; }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; border: 0; background: var(--fill); color: var(--ink); cursor: pointer; flex: none; }
  .icon-btn svg, .btn svg { display: block; flex: none; }

  /* ── Segmented control ─────────────────────────────────────────── */
  .seg { position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); padding: 2px; border-radius: 11px; background: var(--fill); }
  .seg-ind { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / var(--n)); border-radius: 9px; background: var(--seg-ind); box-shadow: var(--seg-shadow); transform: translateX(calc(var(--i) * 100%)); transition: transform 260ms var(--ease); pointer-events: none; }
  .seg-item { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; min-height: 44px; padding: 4px 2px; border: 0; border-radius: 9px; background: transparent; color: var(--ink); font-size: 15px; font-weight: 500; line-height: 1.2; cursor: pointer; text-align: center; white-space: nowrap; }
  .seg-item[aria-checked="true"], .seg-item[aria-selected="true"] { font-weight: 650; }
  .seg-item small { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); margin-top: 2px; }
  /* 選中項底塊（深色 #5a5a5f）上的小字改用主要文字色，對比 ≥4.5:1 */
  .seg-item[aria-checked="true"] small, .seg-item[aria-selected="true"] small { color: var(--ink); }
  .seg-item:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
  /* 5 段（交易類型）：字級隨寬度縮小，4 字標籤兩側各保留約 5px（375px 寬 12.75px；≥420px 為 15px）。
     分段寬 (100vw − 68px) / 5，字寬 4em → 兩側留白 = ((100vw − 68px) / 5 − 4 × (5vw − 6px)) / 2 = 5.2px */
  .seg[data-count="5"] .seg-item { font-size: clamp(12px, calc(5vw - 6px), 15px); }
  .seg-tall .seg-item { min-height: 52px; }
  @media (prefers-reduced-motion: reduce) { .seg-ind { transition: none; } }
  /* 極窄螢幕（<360px）：5 項改兩列，選取狀態改為各項自身背景 */
  @media (max-width: 359px) {
    .seg[data-count="5"] { grid-template-columns: repeat(6, minmax(0, 1fr)); row-gap: 2px; }
    .seg[data-count="5"] > .seg-item:nth-of-type(-n+3) { grid-column: span 2; }
    .seg[data-count="5"] > .seg-item:nth-of-type(n+4) { grid-column: span 3; }
    .seg[data-count="5"] > .seg-ind { display: none; }
    .seg[data-count="5"] > .seg-item[aria-checked="true"] { background: var(--seg-ind); box-shadow: var(--seg-shadow); }
  }

  /* ── 輸入 ─────────────────────────────────────────────────────── */
  .field + .field { margin-top: 16px; }
  .field-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 24px; margin-bottom: 6px; }
  .field-label { font-size: 15px; font-weight: 600; color: var(--ink); }
  .field-aside { font-size: 13px; color: var(--ink-2); text-align: right; min-width: 0; }
  .field-hint { margin: 6px 0 0; font-size: 13px; line-height: 1.45; color: var(--ink-2); }
  .inp { display: block; width: 100%; min-width: 0; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1.5px solid transparent; background: var(--fill); color: var(--ink); font-size: 17px; line-height: 1.3; font-variant-numeric: tabular-nums; -webkit-appearance: none; appearance: none; transition: border-color 120ms ease, background-color 120ms ease; }
  .inp::placeholder { color: var(--ink-3); opacity: 1; }
  .inp:focus { outline: none; border-color: var(--accent); background: var(--card); }
  .inp:focus-visible { outline: none; }
  .inp[aria-invalid="true"] { border-color: var(--danger); }
  .inp-big { min-height: 56px; font-size: 28px; font-weight: 650; text-align: center; letter-spacing: -0.01em; }
  .inp-mid { min-height: 52px; font-size: 22px; font-weight: 600; text-align: center; }
  .inp-big::placeholder, .inp-mid::placeholder { font-weight: 400; }
  .inp-date { min-height: 48px; padding-top: 0; padding-bottom: 0; line-height: 48px; }
  .inp-date::-webkit-date-and-time-value { text-align: left; }
  .inp-wrap { position: relative; }
  .inp-suffix { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--ink-2); pointer-events: none; }
  .inp-wrap .inp { padding-right: 44px; }
  .stepper { display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; gap: 8px; align-items: stretch; }
  .step-btn { display: inline-flex; align-items: center; justify-content: center; min-width: 52px; min-height: 52px; border: 0; border-radius: 14px; background: var(--fill); color: var(--ink); cursor: pointer; }
  .step-btn:disabled { color: var(--ink-3); cursor: default; }
  .step-btn .step-sub { position: absolute; bottom: 4px; left: 0; right: 0; font-size: 11px; font-weight: 600; color: var(--ink-2); text-align: center; pointer-events: none; }
  .stepper-big .step-btn { min-height: 56px; }

  /* 行內訊息 */
  .msgs { margin-top: 8px; display: grid; gap: 6px; }
  .msg { display: flex; align-items: flex-start; gap: 6px; margin: 0; font-size: 14px; line-height: 1.45; }
  .msg > svg { flex: none; margin-top: 2px; }
  .msg-error { color: var(--danger); }
  .msg-warn { color: var(--warn); }
  .msg-info { color: var(--ink-2); }
  .msg-ok { color: var(--ink-2); }
  .msg .btn-mini { margin-left: auto; flex: none; min-height: 44px; margin-top: -11px; margin-bottom: -11px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--accent-tint); color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer; }
  .inline-result { margin-top: 8px; font-size: 15px; line-height: 1.45; color: var(--ink-2); }
  .inline-result b { font-weight: 650; }

  /* ── Chips ────────────────────────────────────────────────────── */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--fill); color: var(--ink); font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--card); font-weight: 650; }

  /* ── 摺疊區 ───────────────────────────────────────────────────── */
  .disc-btn { display: flex; width: 100%; align-items: center; gap: 12px; min-height: 60px; padding: 12px 16px; border: 0; border-radius: 18px; background: transparent; text-align: left; cursor: pointer; color: var(--ink); }
  @media (min-width: 1024px) { .disc-btn { padding: 14px 20px; } }
  .disc-text { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
  .disc-title { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .disc-sum { font-size: 14px; color: var(--ink-2); margin-top: 2px; overflow-wrap: anywhere; }
  .chev { flex: none; color: var(--ink-2); transition: transform 220ms var(--ease); }
  [aria-expanded="true"] > .chev { transform: rotate(180deg); }
  .disc-panel { padding: 0 16px 16px; animation: fade-in 220ms var(--ease); }
  @media (min-width: 1024px) { .disc-panel { padding: 0 20px 20px; } }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 650; line-height: 1.4; white-space: nowrap; }
  .badge-warn { background: var(--warn-tint); color: var(--warn); }
  .badge-gray { background: var(--fill); color: var(--ink-2); }
  .badge-accent { background: var(--accent-tint); color: var(--accent); }
  .badge-danger { background: var(--danger-tint); color: var(--danger); }

<script id="tw-calc-engine">
/*!
 * TWCalc 2.0.0 — 台股當沖・融資融券計算引擎
 * 純 JS（不含 JSX、不依賴 DOM／React），可在瀏覽器與 node:vm 執行。
 * 價格一律以「整數分」處理；所有「金額 × 費率」的取整以 BigInt 精確有理數運算（divFloor / divCeil / divRoundHalfUp）。
 * 法規數值依 SPEC 1.2（資料基準日 2026-11-06）。
 */
(function (global) {
  'use strict';

  // ════════════════════════════════════════════════════════════════════
  // 0. 常數
  // ════════════════════════════════════════════════════════════════════
  const VERSION = '2.0.0';
  const DATA_AS_OF = '2026-11-06';

  const FEE_BASE_N = 1425n;            // 手續費上限 0.1425% = 1425 / 1e6
  const MICRO = 1000000n;              // 1e6
  const R4 = 10000n;                   // 成數精度 1e-4
  const R6 = 1000000n;                 // 年利率精度 1e-6
  const R8 = 100000000n;               // 融券手續費率、證交稅覆寫精度 1e-8

  const PRICE_MAX_CENTS = 10000000;    // 輸入價格上限 100,000 元
  const LOTS_MAX = 100000;             // 張數上限
  const SEARCH_MAX_CENTS = 1000000000; // 反推搜尋價格上限 10,000,000 元（兩種級距表皆為合法價）
  const GRID_MAX_CENTS = 1000000000000;// tick 工具可處理上限
  const GRID_MAX_CENTS_B = BigInt(GRID_MAX_CENTS);
  const MAX_TARGETS = 12;
  // 數值安全上限：所有金額必須落在 Number 安全整數（2^53）內。
  // 最大本金＝融券保證金 1000% × 成交金額 1e13 = 1e14；目標 ±1,000% → |desired| ≤ 1e15；
  // 利息 ≤ 本金 1.1e14 × 年利率 100% × 3,650 天 / 365 ≈ 1.1e15；搜尋上限價 1e7 元 × 1e8 股 = 1e15。
  const TARGET_PCT_MAX = 1000n;        // 目標淨利率上限 ±1,000%
  const DAYS_MAX = 3650n;              // 計息天數上限（信用期限最長 18 個月，3,650 天已足夠寬鬆）
  const LADDER_DEFAULT = 10;
  const LADDER_MAX = 10000;

  // ════════════════════════════════════════════════════════════════════
  // 1. BigInt 精確有理數工具
  // ════════════════════════════════════════════════════════════════════
  /** ⌊a/b⌋（BigInt） */
  function divFloor(a, b) {
    if (b === 0n) throw new RangeError('divFloor：除數為 0');
    const q = a / b;
    return (a % b !== 0n && ((a < 0n) !== (b < 0n))) ? q - 1n : q;
  }
  /** ⌈a/b⌉（BigInt） */
  function divCeil(a, b) {
    return -divFloor(-a, b);
  }
  /** 四捨五入（0.5 往 +∞，與 Math.round 語意相同）（BigInt） */
  function divRoundHalfUp(a, b) {
    if (b < 0n) { a = -a; b = -b; }
    return divFloor(2n * a + b, 2n * b);
  }
  /** 四捨五入（0.5 遠離 0；僅供顯示格式化） */
  function divRoundHalfAway(a, b) {
    if (b < 0n) { a = -a; b = -b; }
    return a < 0n ? -divRoundHalfUp(-a, b) : divRoundHalfUp(a, b);
  }
  const bmax = (a, b) => (a > b ? a : b);

  const POW10 = [1n];
  function pow10(k) {
    while (POW10.length <= k) POW10.push(POW10[POW10.length - 1] * 10n);
    return POW10[k];
  }

  // ════════════════════════════════════════════════════════════════════
  // 2. 輸入正規化與十進位精確解析
  // ════════════════════════════════════════════════════════════════════
  /**
   * 全形數字、全形小數點、各式減號正規化；去除空白、尾端 % 與「折」。
   * 千分位逗號（含全形「，」）必須符合 1,234,567(.89) 格式才去除；格式不對（例：'43,45'、'1,00'）時保留逗號，
   * 後續解析即視為無法辨識（不可把 '43,45' 當成 4345）。
   */
  const GROUPED_RE = /^([+-]?)(\d{1,3}(?:,\d{3})+(?:\.\d+)?)$/;
  function normalizeNumericText(input) {
    if (input === null || input === undefined) return '';
    let s = String(input);
    s = s.replace(/[０-９]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
    s = s.replace(/．/g, '.');
    s = s.replace(/，/g, ',');
    s = s.replace(/[−－‐‑‒–﹣]/g, '-');
    s = s.replace(/[＋﹢]/g, '+');
    s = s.replace(/[\s 　_]/g, '');
    s = s.replace(/(?:%|％|折)$/, '');
    if (s.indexOf(',') >= 0) {
      const m = GROUPED_RE.exec(s);
      if (m) s = m[1] + m[2].replace(/,/g, '');
    }
    return s;
  }

  const NUM_RE = /^([+-]?)(\d*)(?:\.(\d*))?(?:[eE]([+-]?\d{1,3}))?$/;

  function parseDec(input) {
    let s;
    if (typeof input === 'number') {
      if (!Number.isFinite(input)) return null;
      s = String(input);
    } else if (typeof input === 'bigint') {
      s = input.toString();
    } else if (typeof input === 'string') {
      s = normalizeNumericText(input);
    } else {
      return null;
    }
    const m = NUM_RE.exec(s);
    if (!m) return null;
    const ip = m[2] || '';
    const fp = m[3] || '';
    if (ip === '' && fp === '') return null;
    if (ip.length + fp.length > 40) return null;
    let n = BigInt((ip || '0') + fp);
    let d = pow10(fp.length);
    const e = m[4] ? Number(m[4]) : 0;
    if (e > 0) n *= pow10(e);
    else if (e < 0) d *= pow10(-e);
    if (m[1] === '-') n = -n;
    return { n, d };
  }
  /** 讀取欄位：{blank:true} | {invalid:true} | {dec} */
  function readNum(v) {
    if (v === null || v === undefined) return { blank: true };
    if (typeof v === 'string' && normalizeNumericText(v) === '') return { blank: true };
    const dec = parseDec(v);
    return dec ? { dec } : { invalid: true };
  }
  /** 值 × 10^digits 四捨五入為 BigInt */
  function scaleDec(dec, digits) {
    return digits >= 0 ? divRoundHalfUp(dec.n * pow10(digits), dec.d) : divRoundHalfUp(dec.n, dec.d * pow10(-digits));

  const decIsInt = (dec) => dec.n % dec.d === 0n;
  /** dec 與 n2/d2 比較：-1 / 0 / 1 */
  function decCmp(dec, n2, d2) {
    const l = dec.n * d2;
    const r = n2 * dec.d;
    return l < r ? -1 : (l > r ? 1 : 0);
  }
  /** 精確十進位字串（不含指數） */
  function decToString(dec) {
    let { n, d } = dec;
    const neg = n < 0n;
    if (neg) n = -n;
    let k = 0;
    while (pow10(k) < d) k += 1;
    const ip = n / d;
    let fp = (n % d).toString().padStart(k, '0').replace(/0+$/, '');
    return (neg && n !== 0n ? '-' : '') + ip.toString() + (fp ? '.' + fp : '');
  }
  const decToNumber = (dec) => Number(decToString(dec));
  /** 解析為 number（正規化全形、逗號、% 等）；無法解析回傳 null */
  function parseNumber(input) {
    const dec = parseDec(input);
    return dec ? decToNumber(dec) : null;
  }
  /** 整數縮放值 → 數字（例：scaled=64500, digits=6 → 0.0645） */
  const scaledToNumber = (scaled, digits) => decToNumber({ n: BigInt(scaled), d: pow10(digits) });

  // ════════════════════════════════════════════════════════════════════
  // 3. 日期（台北時區，台灣無日光節約時間）
  // ════════════════════════════════════════════════════════════════════
  const pad2 = (x) => (x < 10 ? '0' : '') + x;
  function todayTaipei(now) {
    let ms;
    if (now === undefined || now === null) ms = Date.now();
    else if (typeof now === 'object' && typeof now.getTime === 'function') ms = now.getTime();

    if (!Number.isFinite(ms)) ms = Date.now();

  function normalizeDate(s) {
    if (typeof s !== 'string') return null;
    const m = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/.exec(s.trim());
    if (!m) return null;
    const y = Number(m[1]);
    const mo = Number(m[2]);
    const d = Number(m[3]);
    if (y < 1990 || y > 2100 || mo < 1 || mo > 12 || d < 1) return null;
    const dim = new Date(Date.UTC(y, mo, 0)).getUTCDate();
    if (d > dim) return null;

  }

  function addDaysIso(date, days) {
    const y = Number(date.slice(0, 4));
    const mo = Number(date.slice(5, 7));
    const d = Number(date.slice(8, 10));
    const t = new Date(Date.UTC(y, mo - 1, d + days));
    return `${t.getUTCFullYear()}-${pad2(t.getUTCMonth() + 1)}-${pad2(t.getUTCDate())}`;
  }

  // ════════════════════════════════════════════════════════════════════
  // 4. 升降單位（整數分）
  // ════════════════════════════════════════════════════════════════════
  function buildTickTable(rows) {
    let base = 0;
    return Object.freeze(rows.map(([lo, hi, t]) => {
      const count = hi === Infinity ? Infinity : (hi - lo) / t;
      const band = Object.freeze({ lo, hi, t, base, count });
      base += count;
      return band;
    }));
  }
  // [下限(含), 上限(不含), 升降單位]，單位：分。各級距下限皆為該級距升降單位之倍數。
  const TICK_TABLES = Object.freeze({
    stock: buildTickTable([[1, 1000, 1], [1000, 5000, 5], [5000, 10000, 10], [10000, 50000, 50], [50000, 100000, 100], [100000, Infinity, 500]]),
    etf: buildTickTable([[1, 5000, 1], [5000, Infinity, 5]]),
  });

  function bandOf(table, pc) {
    for (let i = 0; i < table.length; i += 1) if (pc < table[i].hi) return table[i];
    return table[table.length - 1];
  }
  const tickAt = (table, pc) => bandOf(table, pc < 1 ? 1 : pc).t;
  /** 合法價（分）→ 格點序號（0 = 0.01）；非合法價回傳 -1 */
  function gridIndex(table, pc) {
    if (!Number.isSafeInteger(pc) || pc < 1) return -1;
    const b = bandOf(table, pc);
    const r = pc - b.lo;
    return r % b.t === 0 ? b.base + r / b.t : -1;
  }
  /** 格點序號 → 合法價（分） */
  function gridPrice(table, idx) {
    if (!Number.isSafeInteger(idx) || idx < 0) return null;
    for (let i = 0; i < table.length; i += 1) {
      const b = table[i];
      if (idx < b.base + b.count) return b.lo + (idx - b.base) * b.t;
    }
    return null;
  }
  const stepUp = (table, pc) => pc + tickAt(table, pc);
  const stepDown = (table, pc) => (pc <= 1 ? null : pc - tickAt(table, pc - 1));
  /** 最大 ≤ n/d 分的合法價；不存在回傳 null */
  function floorGridR(table, n, d) {
    if (n <= 0n) return null;
    const fl = divFloor(n, d);
    if (fl < 1n || fl > GRID_MAX_CENTS_B) return null;
    const t = tickAt(table, Number(fl));
    return Number(divFloor(n, d * BigInt(t))) * t;
  }
  /** 最小 ≥ n/d 分的合法價（≤0 回傳 null） */
  function ceilGridR(table, n, d) {
    if (n <= 0n) return null;
    if (n <= d) return 1;
    const fl = divFloor(n, d);
    if (fl > GRID_MAX_CENTS_B) return null;
    const t = tickAt(table, Number(fl));
    return Number(divCeil(n, d * BigInt(t))) * t;
  }
  /** 最接近 n/d 分的合法價；等距取較高價 */
  function nearestGridR(table, n, d) {
    const c = ceilGridR(table, n, d);
    if (c === null) return null;
    const f = floorGridR(table, n, d);
    if (f === null || f === c) return c;
    const df = n - BigInt(f) * d;
    const dc = BigInt(c) * d - n;
    return dc <= df ? c : f;
  }
  function tableFor(productType) {
    const p = PRODUCTS[productType];
    return p ? TICK_TABLES[p.tickTable] : null;
  }
  /** 價格（number/字串）→ 以「分」為單位的有理數 {n, d}；≤0 或無法解析回傳 null */
  function priceRat(price) {
    const dec = parseDec(price);
    if (!dec || dec.n <= 0n) return null;
    return { n: dec.n * 100n, d: dec.d };
  }
  function roundCents(table, rat, mode) {
    if (mode === 'floor') return floorGridR(table, rat.n, rat.d);
    if (mode === 'ceil') return ceilGridR(table, rat.n, rat.d);
    return nearestGridR(table, rat.n, rat.d);
  }
  const centsToPrice = (pc) => (pc === null ? null : pc / 100);

  function getTickSize(price, productType) {
    const table = tableFor(productType);
    const rat = priceRat(price);
    if (!table || !rat) return null;
    const fl = divFloor(rat.n, rat.d);
    if (fl > GRID_MAX_CENTS_B) return null;
    return tickAt(table, Number(fl < 1n ? 1n : fl)) / 100;
  }
  function roundToTick(price, productType, mode) {
    const table = tableFor(productType);
    const rat = priceRat(price);
    if (!table || !rat) return null;
    return centsToPrice(roundCents(table, rat, mode || 'nearest'));
  }
  function addTick(price, steps, productType) {
    const table = tableFor(productType);
    const rat = priceRat(price);
    const k = steps === undefined ? 1 : Number(steps);
    if (!table || !rat || !Number.isSafeInteger(k)) return null;
    let idx;
    const onGrid = rat.n % rat.d === 0n && rat.n / rat.d <= GRID_MAX_CENTS_B && gridIndex(table, Number(rat.n / rat.d)) >= 0;
    if (onGrid) {
      idx = gridIndex(table, Number(rat.n / rat.d)) + k;
    } else if (k === 0) {
      return centsToPrice(nearestGridR(table, rat.n, rat.d));
    } else if (k > 0) {
      const c = ceilGridR(table, rat.n, rat.d);
      if (c === null) return null;
      idx = gridIndex(table, c) + k - 1;
    } else {
      const f = floorGridR(table, rat.n, rat.d);
      if (f === null) return null;
      idx = gridIndex(table, f) + k + 1;
    }
    const pc = gridPrice(table, idx);
    return pc === null || pc > GRID_MAX_CENTS ? null : pc / 100;
  }
  function countTicksBetween(from, to, productType) {
    const table = tableFor(productType);
    const a = priceRat(from);
    const b = priceRat(to);
    if (!table || !a || !b) return null;
    const pa = nearestGridR(table, a.n, a.d);
    const pb = nearestGridR(table, b.n, b.d);
    if (pa === null || pb === null) return null;
    return gridIndex(table, pb) - gridIndex(table, pa);
  }

  // ════════════════════════════════════════════════════════════════════
  // 5. 漲跌停
  // ════════════════════════════════════════════════════════════════════
  /** refRat：參考價（分）有理數；L：漲跌幅 {n, d}（分數）→ {upPc, downPc} */
  function priceLimitsCents(table, refRat, L) {
    const n = refRat.n;
    const d = refRat.d;
    let up = floorGridR(table, n * (L.d + L.n), d * L.d);
    const downN = n * (L.d - L.n);
    let down = downN <= 0n ? 1 : ceilGridR(table, downN, d * L.d);
    // 不足一檔以一檔計
    if (up === null || BigInt(up) * d <= n) up = ceilAbove(table, refRat);
    if (down === null || BigInt(down) * d >= n) {
      const below = floorBelow(table, refRat);
      down = below === null ? 1 : below;
    }
    if (down < 1) down = 1;
    return { upPc: up, downPc: down };
  }
  /** 最小 > x 的合法價 */
  function ceilAbove(table, rat) {
    const c = ceilGridR(table, rat.n, rat.d);
    return BigInt(c) * rat.d === rat.n ? stepUp(table, c) : c;
  }
  /** 最大 < x 的合法價；不存在回傳 null */
  function floorBelow(table, rat) {
    const f = floorGridR(table, rat.n, rat.d);
    if (f === null) return null;
    return BigInt(f) * rat.d === rat.n ? stepDown(table, f) : f;
  }
  /** limitPct：0.1/0.2（分數）；null 或 'none' = 無限制；undefined = 預設 10% */
  function parseLimitPct(limitPct) {
    if (limitPct === null || limitPct === 'none' || limitPct === 'null') return { none: true };
    if (limitPct === undefined || (typeof limitPct === 'string' && normalizeNumericText(limitPct) === '')) {
      return { dec: { n: 1n, d: 10n }, defaulted: true };
    }
    const dec = parseDec(limitPct);
    if (!dec || dec.n <= 0n || decCmp(dec, 1n, 1n) > 0) return { invalid: true };
    return { dec };
  }

  function getPriceLimits(refPrice, productType, limitPct) {
    try {
      const table = tableFor(productType);
      const rat = priceRat(refPrice);
      if (!table || !rat) return null;
      if (rat.n > BigInt(PRICE_MAX_CENTS) * rat.d) return null;
      const lp = parseLimitPct(limitPct);
      if (lp.none || lp.invalid) return null;
      const r = priceLimitsCents(table, rat, lp.dec);
      if (r.upPc === null || r.downPc === null) return null;
      return { refPrice: decToNumber({ n: rat.n, d: rat.d * 100n }), limitUp: r.upPc / 100, limitDown: r.downPc / 100, limitPct: decToNumber(lp.dec) };
    } catch (err) {
      return null;
    }
  }

    maintenance: { callLevel: 130, releaseLevel: 166, graceBusinessDays: 2, note: '整戶維持率低於 130% 追繳，2 個營業日內補繳，逾期次一營業日處分；回到 166% 以上解除（本計算機假設帳戶僅此一筆部位）' },
    creditTerm: { days: 180, extensions: 2, maxMonths: 18, note: '信用交易期限 6 個月，可展延 2 次（最長 18 個月）；零股、鉅額交易不得信用交易' },
    daysPresets: [0, 7, 30, 60, 90, 180],
    maxTargets: MAX_TARGETS,
    priceMax: PRICE_MAX_CENTS / 100,
    lotsMax: LOTS_MAX,
    notModeled: ['融券除權息強制回補與股利支付', '標借費、議借費、借券費', '處置股保證金加成', '整戶擔保品抵繳與多部位整戶維持率', '零股交易'],
  });

  // ════════════════════════════════════════════════════════════════════
  // 7. 稅率、保證金最低成數
  // ════════════════════════════════════════════════════════════════════
  function shortMarginPeriod(tradeDate) {
    const date = normalizeDate(typeof tradeDate === 'string' ? tradeDate : '') || todayTaipei();
    for (let i = 0; i < SHORT_MARGIN_PERIODS.length; i += 1) {
      const p = SHORT_MARGIN_PERIODS[i];
      if ((p.from === null || date >= p.from) && (p.to === null || date <= p.to)) return p;
    }
    return SHORT_MARGIN_PERIODS[SHORT_MARGIN_PERIODS.length - 1];
  }
  function getMinShortMarginRatio(tradeDate) {
    const p = shortMarginPeriod(tradeDate);
    return { ratio: p.ratio, from: p.from, to: p.to, note: p.note };
  }

  /** 證交稅覆寫（%字串）→ {r8} | {blank} | {invalid} */
  function parseTaxOverride(v) {
    const r = readNum(v);
    if (r.blank) return { blank: true };
    if (r.invalid) return { invalid: true };
    const r8 = scaleDec(r.dec, 6); // 百分比取到 1e-6 → 分數 1e-8
    if (r8 < 0n || r8 > 10000000n) return { invalid: true, outOfRange: true };
    return { r8 };
  }

  /** 有理數分數 → 精簡百分比字串（例：100000/1e8 → '0.1%'） */
  const ratePctLabel = (n, d) => `${scaledToPlain(divRoundHalfUp(n * 1000000n, d), 4)}%`;

  /** 內部：回傳 {n, d, rate, label, note, overridden, warnings[]} */
  function resolveTaxInternal(productType, tradeMode, tradeDate, taxRateOverride) {
    const warnings = [];
    const date = normalizeDate(typeof tradeDate === 'string' ? tradeDate : '') || todayTaipei();
    const ov = parseTaxOverride(taxRateOverride);
    if (ov.r8 !== undefined) {
      const label = `已自訂 ${ratePctLabel(ov.r8, R8)}`;
      return { n: ov.r8, d: R8, rate: Number(decToString({ n: ov.r8, d: R8 })), label, note: '證交稅率已自訂，取代預設規則', overridden: true, warnings };
    }
    if (ov.invalid) {
      warnings.push({ code: 'TAX_OVERRIDE_INVALID', level: 'warn', message: ov.outOfRange ? '證交稅覆寫須介於 0%–10%，已忽略並改用預設稅率' : '證交稅覆寫格式不正確，已忽略並改用預設稅率', field: 'taxRateOverride' });
    }
    const credit = tradeMode === 'marginLong' || tradeMode === 'marginShort' || tradeMode === 'creditDayTrade';
    let n; let d; let label; let note;
    if (productType === 'bondEtf') {
      if (date < BOND_ETF_EXEMPTION.from) {
        n = 1n; d = 1000n; label = '債券ETF 0.1%（停徵尚未施行）';
        note = '債券 ETF 證交稅停徵自 2017/01/01 起施行，之前以 0.1% 計算';
      } else if (date <= BOND_ETF_EXEMPTION.to) {
        n = 0n; d = 1n; label = '債券ETF 停徵 0%';
        note = '被動式、非槓反債券 ETF 停徵證交稅至 2026/12/31；槓反／主動式債券 ETF 請選 ETF（0.1%）';
        if (date >= '2026-12-30') warnings.push({ code: 'BOND_ETF_EXEMPTION_BOUNDARY', level: 'info', message: '成交日接近停徵期限（2026/12/31），交割日將跨年，本計算以成交日判斷', field: 'tradeDate' });
      } else {
        n = 1n; d = 1000n; label = '債券ETF 0.1%（停徵期限已到）';
        note = '停徵期限 2026/12/31 已到，預設以 0.1% 計算';
        warnings.push({ code: 'BOND_ETF_EXEMPTION_ENDED', level: 'warn', message: '債券 ETF 證交稅停徵期限已到（2026/12/31），延長案（行政院版延至 2036/12/31）待立法院三讀；目前以 0.1% 計算，可於進階設定覆寫稅率', field: 'tradeDate' });
      }
    } else if (productType === 'etf') {
      n = 1n; d = 1000n; label = credit ? 'ETF 0.1%（信用交易）' : (tradeMode === 'dayTrade' ? 'ETF 0.1%（當沖不減半）' : 'ETF 0.1%');
      note = 'ETF／ETN（含槓反、主動式）證交稅 0.1%，當沖不減半';
    } else if (credit) {
      n = 3n; d = 1000n; label = tradeMode === 'creditDayTrade' ? '資券當沖 0.3%' : '信用交易 0.3%';
      note = '信用交易（含資券當沖、同日資買資賣／券賣券買）一律 0.3%，不適用當沖降稅';
    } else if (tradeMode === 'dayTrade') {
      if (date < DAY_TRADE_TAX_CUT.from) {
        n = 3n; d = 1000n; label = '一般 0.3%（當沖降稅尚未施行）';
        note = '現股當沖降稅自 2017/04/28 起施行';
      } else if (date <= DAY_TRADE_TAX_CUT.to) {
        n = 15n; d = 10000n; label = '現股當沖 0.15%';
        note = '現股當沖證交稅減半至 2027/12/31（依成交日判斷）';
        if (date >= '2027-12-30') warnings.push({ code: 'TAX_CUT_BOUNDARY', level: 'info', message: '成交日接近當沖降稅期限（2027/12/31），交割日將在 2028 年，本計算以成交日判斷', field: 'tradeDate' });
      } else {
        n = 3n; d = 1000n; label = '一般 0.3%（當沖降稅期限已過）';
        note = '現股當沖降稅期限 2027/12/31 已過，預設以 0.3% 計算';
        warnings.push({ code: 'TAX_CUT_EXPIRED', level: 'warn', message: '現股當沖降稅期限已過（2027/12/31），請確認是否延長；目前以 0.3% 計算，可於進階設定覆寫稅率', field: 'tradeDate' });
      }
    } else {
      n = 3n; d = 1000n; label = '一般賣出 0.3%';
      note = '個股一般賣出證交稅 0.3%';
    }
    return { n, d, rate: Number(decToString({ n, d })), label, note, overridden: false, warnings };
  }
  function resolveTaxRate(opts) {
    const o = opts || {};
    const r = resolveTaxInternal(o.productType, o.tradeMode, o.tradeDate, o.taxRateOverride);
    return { rate: r.rate, label: r.label, note: r.note, overridden: r.overridden, warnings: r.warnings };
  }

  // ════════════════════════════════════════════════════════════════════
  // 8. 手續費、證交稅
  // ════════════════════════════════════════════════════════════════════
  const DEFAULT_DISCOUNT_MICRO = 180000n;
  function discountLabel(micro) {
    if (micro === MICRO) return '無折扣';
    return `${scaledToPlain(micro, 5)} 折`;
  }
  function parseDiscountInternal(input) {
    const r = readNum(input);
    let micro; let adjusted = false; let clamped = false; let invalid = false; let defaulted = false;
    if (r.blank) { micro = DEFAULT_DISCOUNT_MICRO; defaulted = true; }
    else if (r.invalid) { micro = DEFAULT_DISCOUNT_MICRO; invalid = true; }
    else if (r.dec.n < 0n) { micro = 0n; clamped = true; }
    else if (decCmp(r.dec, 1n, 1n) <= 0) { micro = scaleDec(r.dec, 6); }
    else if (decCmp(r.dec, 10n, 1n) <= 0) { micro = scaleDec(r.dec, 5); adjusted = true; }
    else { micro = MICRO; clamped = true; }
    if (micro > MICRO) micro = MICRO;
    return { micro, value: scaledToNumber(micro, 6), label: discountLabel(micro), adjusted, clamped, invalid, defaulted };
  }
  /** '2.8' → {value:0.28, label:'2.8 折', adjusted:true}；'0.18' → 0.18；'10'/'1' → 1（無折扣） */
  function parseDiscount(input) {
    const p = parseDiscountInternal(input);
    return { value: p.value, label: p.label, adjusted: p.adjusted, clamped: p.clamped, invalid: p.invalid, defaulted: p.defaulted };
  }

  const ZERO_COMM = Object.freeze({ charged: 0n, refund: 0n, net: 0n });
  /** gross：BigInt 元；回傳 BigInt {charged, refund, net} */
  function commissionB(gross, discMicro, minFee, model) {
    if (gross <= 0n) return ZERO_COMM;
    if (model === 'monthly') {
      const charged = bmax(divFloor(gross * FEE_BASE_N, MICRO), minFee);
      const refund = divFloor(charged * (MICRO - discMicro), MICRO);
      return { charged, refund, net: charged - refund };
    }
    const fee = bmax(divFloor(gross * FEE_BASE_N * discMicro, MICRO * MICRO), minFee);
    return { charged: fee, refund: 0n, net: fee };
  }
  function taxB(gross, n, d, rounding) {
    if (gross <= 0n || n <= 0n) return 0n;
    return rounding === 'round' ? divRoundHalfUp(gross * n, d) : divFloor(gross * n, d);
  }
  const commToNumbers = (c) => ({ charged: Number(c.charged), refund: Number(c.refund), net: Number(c.net) });
  /** 金額（元）→ BigInt；非整數以元以下捨去 */
  function grossToBig(gross) {
    const dec = parseDec(gross);
    if (!dec) return null;
    return divFloor(dec.n, dec.d);
  }
  function minFeeToBig(v) {
    const r = readNum(v);
    if (r.blank || r.invalid) return 20n;
    const x = scaleDec(r.dec, 0);
    return x < 0n ? 0n : x;
  }
  function calculateCommission(gross, opts) {
    const o = opts || {};
    const g = grossToBig(gross);
    if (g === null) return { charged: 0, refund: 0, net: 0 };
    let micro;
    if (typeof o.discount === 'number' || typeof o.discount === 'string' || typeof o.discount === 'bigint') micro = parseDiscountInternal(o.discount).micro;
    else micro = MICRO;
    const model = o.feeModel === 'monthly' ? 'monthly' : 'instant';
    return commToNumbers(commissionB(g, micro, o.minFee === undefined ? 20n : minFeeToBig(o.minFee), model));
  }
  function calculateTax(gross, rate, rounding) {
    const g = grossToBig(gross);
    const r = parseDec(rate);
    if (g === null || !r) return 0;
    return Number(taxB(g, r.n, r.d, rounding === 'round' ? 'round' : 'floor'));
  }

  // ════════════════════════════════════════════════════════════════════
  // 9. 顯示格式
  // ════════════════════════════════════════════════════════════════════
  const groupDigits = (s) => s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  /** number → 依 digits 位小數四捨五入（遠離 0）的 BigInt；不合法回傳 null */
  function roundForDisplay(v, digits) {
    if (typeof v === 'bigint') return v * pow10(digits);
    const dec = parseDec(v);
    return dec ? divRoundHalfAway(dec.n * pow10(digits), dec.d) : null;
  }
  function fmtScaled(scaled, digits, group) {
    const neg = scaled < 0n;
    const a = neg ? -scaled : scaled;
    const p = pow10(digits);
    const ip = (a / p).toString();
    const fp = digits > 0 ? '.' + (a % p).toString().padStart(digits, '0') : '';
    return (neg ? '-' : '') + (group ? groupDigits(ip) : ip) + fp;
  }
  function fmtCurrency(v) {
    const r = roundForDisplay(v, 0);
    return r === null ? '--' : fmtScaled(r, 0, true);
  }
  function fmtSignedCurrency(v) {
    const r = roundForDisplay(v, 0);
    if (r === null) return '--';
    if (r === 0n) return '0';
    return (r > 0n ? '+' : '-') + fmtScaled(r > 0n ? r : -r, 0, true);
  }
  function fmtPrice(v) {
    if (v === null || v === undefined) return '--';
    const r = roundForDisplay(v, 2);
    return r === null ? '--' : fmtScaled(r, 2, true);
  }
  function fmtPercent(v, opts) {
    if (v === null || v === undefined) return '--';
    const digits = opts && Number.isInteger(opts.digits) ? Math.max(0, Math.min(6, opts.digits)) : 2;
    const r = roundForDisplay(v, digits + 2);
    if (r === null) return '--';
    if (r === 0n) return fmtScaled(0n, digits, true) + '%';
    const sign = r > 0n ? (opts && opts.signed ? '+' : '') : '-';
    return sign + fmtScaled(r > 0n ? r : -r, digits, true) + '%';
  }
  /** 分數 → 精簡百分比（最多 4 位小數，去尾零）：1.3 → '130%'、0.001425 → '0.1425%' */
  function fmtRatio(v) {
    if (v === null || v === undefined) return '--';
    const r = roundForDisplay(v, 6);
    if (r === null) return '--';
    const parts = scaledToPlain(r < 0n ? -r : r, 4).split('.');
    return (r < 0n ? '-' : '') + groupDigits(parts[0]) + (parts[1] ? '.' + parts[1] : '') + '%';
  }
  /** 維持率（%數值）→ '166.66%'：向下截斷到 0.01%，不進位（129.996 顯示 129.99%，不會誤讀為已達 130%） */
  function fmtMaintenance(v) {
    if (v === null || v === undefined) return '--';
    const dec = typeof v === 'bigint' ? { n: v, d: 1n } : parseDec(v);
    if (!dec) return '--';
    return fmtScaled(divFloor(dec.n * 100n, dec.d), 2, true) + '%';
  }
  function fmtTicks(n) {
    if (n === null || n === undefined || !Number.isFinite(n)) return '--';
    if (n === 0) return '平盤';
    return `${n > 0 ? '+' : '-'}${groupDigits(String(Math.abs(n)))} 檔`;
  }
  const format = Object.freeze({
    currency: fmtCurrency,
    signedCurrency: fmtSignedCurrency,
    price: fmtPrice,
    percent: fmtPercent,
    ratio: fmtRatio,
    maintenance: fmtMaintenance,
    ticks: fmtTicks,
  });
  const fmtPc = (pc) => fmtPrice(pc / 100);

  // ════════════════════════════════════════════════════════════════════
  // 10. 預設值、目標清單
  // ════════════════════════════════════════════════════════════════════
  const DEFAULT_TARGETS = '3, 2.5, 2, 1, 0, -1, -2';
  function getDefaults() {
    return {
      tradeMode: 'marginLong', direction: 'long', productType: 'stock', lots: '10',
      entryPrice: '', exitPrice: '', stopLoss: '', refPrice: '', limitPct: '0.1',
      discount: '0.18', minFee: '20', feeModel: 'instant', taxRounding: 'floor', taxRateOverride: '',
      tradeDate: '',
      marginSelfRatio: '40', marginInterestRate: '6.45', marginDays: '30',
      shortMarginRatio: '', shortFeeRate: '0.08', shortInterestRate: '0.2', shortDays: '30',
      targets: DEFAULT_TARGETS,
    };
  }
  /** 目標淨利率清單（%）：字串（逗號／頓號／分號／空白分隔）或陣列 */
  function parseTargetsInternal(input) {
    let tokens;
    if (input === undefined) tokens = DEFAULT_TARGETS.split(/,\s*/);
    else if (input === null) tokens = [];
    else if (Array.isArray(input)) tokens = input.map((x) => (typeof x === 'number' ? x : String(x)));
    else tokens = String(input).split(/[,，、;；\s　]+/);
    const decs = [];
    const invalid = [];
    tokens.forEach((tok) => {
      if (typeof tok === 'string' && normalizeNumericText(tok) === '') return;
      const dec = parseDec(tok);
      // 上限 ±1,000%（見 TARGET_PCT_MAX 說明）
      if (!dec || decCmp(dec, TARGET_PCT_MAX, 1n) > 0 || decCmp(dec, -TARGET_PCT_MAX, 1n) < 0) invalid.push(String(tok));
      else decs.push(dec);
    });
    return { decs: decs.slice(0, MAX_TARGETS), invalid, truncated: decs.length > MAX_TARGETS, total: decs.length };
  }
  function parseTargets(input) {
    const p = parseTargetsInternal(input);
    return { values: p.decs.map(decToNumber), invalid: p.invalid, truncated: p.truncated };
  }

  // ════════════════════════════════════════════════════════════════════
  // 11. 輸入清洗（SPEC 1.9）
  // ════════════════════════════════════════════════════════════════════
  function makeBag() {
    const list = [];
    const seen = new Set();
    return {
      list,
      add(code, level, message, field) {
        const key = `${code}|${field || ''}`;
        if (seen.has(key)) return;
        seen.add(key);
        list.push({ code, level, message, field: field || null });
      },
    };
  }
  const DROP = { add() {} };
  const str = (v) => (v === null || v === undefined ? '' : String(v).trim());

  /**
   * 百分比欄位 → 以分數 10^-scale 表示的 BigInt。
   * spec：{field, label, def(字串%), scale, min, max, minCode, maxCode, minMsg, maxMsg}
   */
  function cleanPercent(v, spec, bag) {
    const r = readNum(v);
    const def = scaleDec(parseDec(spec.def), spec.scale - 2);
    if (r.blank) return def;
    if (r.invalid) {
      bag.add('INPUT_INVALID', 'warn', `${spec.label}格式不正確，已改用預設值 ${spec.def}%`, spec.field);
      return def;
    }
    let x = scaleDec(r.dec, spec.scale - 2);
    if (spec.min !== undefined && x < spec.min) {
      bag.add(spec.minCode || 'INPUT_CLAMPED', 'warn', spec.minMsg(x), spec.field);
      x = spec.min;
    } else if (spec.max !== undefined && x > spec.max) {
      bag.add(spec.maxCode || 'INPUT_CLAMPED', 'warn', spec.maxMsg(x), spec.field);
      x = spec.max;
    }
    return x;
  }
  function cleanDays(v, field, label, bag) {
    const r = readNum(v);
    if (r.blank) return 30;
    if (r.invalid) {
      bag.add('INPUT_INVALID', 'warn', `${label}格式不正確，已改用預設值 30 天`, field);
      return 30;
    }
    if (r.dec.n < 0n) {
      bag.add('INPUT_CLAMPED', 'warn', `${label}不可為負數，已以 0 天計算`, field);
      return 0;
    }
    let x = scaleDec(r.dec, 0);
    if (!decIsInt(r.dec)) bag.add('DAYS_ROUNDED', 'warn', `${label} ${decToString(r.dec)} 不是整數，已四捨五入為 ${x} 天`, field);
    if (x > DAYS_MAX) {
      bag.add('INPUT_CLAMPED', 'warn', `${label}超過 ${groupDigits(DAYS_MAX.toString())} 天，已以 ${groupDigits(DAYS_MAX.toString())} 天計算`, field);
      x = DAYS_MAX;
    }
    return Number(x);
  }
  function cleanEnum(v, allowed, def, field, label, bag) {
    const s = str(v);
    if (s === '') return def;
    if (allowed.indexOf(s) >= 0) return s;
    bag.add('INPUT_INVALID', 'warn', `${label}「${s}」不支援，已改用預設值`, field);
    return def;
  }

  // ════════════════════════════════════════════════════════════════════
  // 12. 交易計算核心
  // ════════════════════════════════════════════════════════════════════
  const CTX = new WeakMap();

  /**
   * 維持率（%）＝ num / den × 100，以 BigInt 精確計算並「向下截斷到 0.01%」：⌊num × 10000 / den⌋ / 100。
   * 因 130 為 0.01 的整數倍，顯示值 < 130 ⇔ num × 100 < 130 × den（與 belowCall 的整數判斷完全一致）。
   */
  function maintenancePct(num, den) {
    return Number(divFloor(num * 10000n, den)) / 100;
  }

  function exitGrossB(ctx, pc) {
    return BigInt(pc) * ctx.lotsB * 10n; // = 價格(分) × 股數 / 100
  }
  /** 只算損益（BigInt），供反推搜尋使用 */
  function profitAt(ctx, pc) {
    const eg = exitGrossB(ctx, pc);
    const xc = commissionB(eg, ctx.discMicro, ctx.minFee, ctx.feeModel);
    const xt = ctx.exitHasTax ? taxB(eg, ctx.taxN, ctx.taxD, ctx.taxRounding) : 0n;
    const xs = ctx.exitHasShortFee ? divRoundHalfUp(eg * ctx.sfR8, R8) : 0n;
    const costs = ctx.entryCostsNet + xc.net + xt + xs + ctx.interestCost - ctx.interestIncome;
    return ctx.isLong ? eg - ctx.G - costs : ctx.G - eg - costs;
  }
  /** 完整 Trade（number） */
  function tradeAt(ctx, pc, ticks) {
    const eg = exitGrossB(ctx, pc);
    const xc = commissionB(eg, ctx.discMicro, ctx.minFee, ctx.feeModel);
    const xt = ctx.exitHasTax ? taxB(eg, ctx.taxN, ctx.taxD, ctx.taxRounding) : 0n;
    const xs = ctx.exitHasShortFee ? divRoundHalfUp(eg * ctx.sfR8, R8) : 0n;
    const totalCosts = ctx.entryCostsNet + xc.net + xt + xs + ctx.interestCost - ctx.interestIncome;
    const profit = ctx.isLong ? eg - ctx.G - totalCosts : ctx.G - eg - totalCosts;

    let amount;
    switch (ctx.modeKey) {
      case 'cash':
        amount = eg - xc.charged - xt;
        break;
      case 'marginLong':
        amount = eg - xc.charged - xt - ctx.loan - ctx.interestCost;
        break;
      case 'marginShort':
        amount = ctx.collateral + ctx.guaranty - eg - xc.charged + ctx.interestIncome;
        break;
      default: { // dayTrade / creditDayTrade：差額交割
        const entryCash = ctx.isLong ? -(ctx.G + ctx.ec.charged) : ctx.G - ctx.ec.charged - ctx.etax - ctx.esf;
        const exitCash = ctx.isLong ? eg - xc.charged - xt - xs : -(eg + xc.charged);
        amount = entryCash + exitCash;
      }
    }

    let maintenance = null;
    let belowCall = false;
    if (ctx.modeKey === 'marginLong' && ctx.loan > 0n) {
      maintenance = maintenancePct(eg, ctx.loan);
      belowCall = eg * 100n < 130n * ctx.loan;
    } else if (ctx.modeKey === 'marginShort' && eg > 0n) {
      const cg = ctx.collateral + ctx.guaranty;
      maintenance = maintenancePct(cg, eg);
      belowCall = cg * 100n < 130n * eg;
    }
    const changeRate = (pc - ctx.entryPc) / ctx.entryPc;
    const interestType = ctx.modeKey === 'marginLong' ? 'cost' : (ctx.modeKey === 'marginShort' ? 'income' : null);
    return {
      exitPrice: pc / 100,
      ticks: ticks === undefined ? gridIndex(ctx.table, pc) - ctx.entryIdx : ticks,
      changeRate,
      exitGross: Number(eg),
      exitCommission: commToNumbers(xc),
      exitTax: Number(xt),
      exitShortFee: Number(xs),
      interest: Number(interestType === 'cost' ? ctx.interestCost : (interestType === 'income' ? ctx.interestIncome : 0n)),
      interestType,
      totalCosts: Number(totalCosts),
      profit: Number(profit),
      returnRate: ctx.capitalBase > 0n ? Number(profit) / Number(ctx.capitalBase) : null,
      nominalReturnRate: ctx.isLong ? changeRate : 0 - changeRate,
      settlement: { label: ctx.settlementLabel, amount: Number(amount) },
      maintenance,
      belowCall,
      beyondLimit: ctx.limits ? (pc > ctx.limits.upPc || pc < ctx.limits.downPc) : false,
    };
  }

  /** 理論價（忽略最低手續費與取整），浮點，僅供顯示與搜尋起點 */
  function theoreticalPrice(ctx, desired) {
    const rFee = 0.001425 * ctx.discValue;
    const G = Number(ctx.G);
    const K = Number(ctx.entryCostsNet + ctx.interestCost - ctx.interestIncome);
    if (ctx.isLong) {
      const rOut = rFee + (ctx.exitHasTax ? ctx.taxRateNum : 0) + (ctx.exitHasShortFee ? ctx.sfRateNum : 0);
      return (G + K + desired) / (ctx.shares * (1 - rOut));
    }
    return (G - K - desired) / (ctx.shares * (1 + rFee));
  }
  function startIndex(ctx, theo) {
    if (!(theo > 0.01)) return 0;
    if (theo * 100 >= SEARCH_MAX_CENTS) return ctx.idxMax;
    const dec = parseDec(theo);
    const pc = dec ? nearestGridR(ctx.table, dec.n * 100n, dec.d) : 1;
    const idx = gridIndex(ctx.table, pc === null ? 1 : pc);
    return idx < 0 ? 0 : Math.min(idx, ctx.idxMax);
  }
  const half = (x) => (x - (x % 2)) / 2;
  /** sat 對序號單調（false…false true…true），回傳最小 true；無則 null */
  function lowestTrue(sat, start, lo, hi) {
    let good; let bad;
    if (sat(start)) {
      good = start;
      let step = 1;
      for (;;) {
        const probe = good - step;
        if (probe < lo) {
          if (good === lo || sat(lo)) return lo;
          bad = lo;
          break;
        }
        if (sat(probe)) { good = probe; step *= 2; } else { bad = probe; break; }
      }
    } else {
      bad = start;
      let step = 1;
      for (;;) {
        const probe = bad + step;
        if (probe > hi) {
          if (bad === hi || !sat(hi)) return null;
          good = hi;
          break;
        }
        if (sat(probe)) { good = probe; break; } else { bad = probe; step *= 2; }
      }
    }
    while (good - bad > 1) {
      const mid = bad + half(good - bad);
      if (sat(mid)) good = mid; else bad = mid;
    }
    return good;
  }
  /** sat 對序號單調（true…true false…false），回傳最大 true；無則 null */
  function highestTrue(sat, start, lo, hi) {
    let good; let bad;
    if (sat(start)) {
      good = start;
      let step = 1;
      for (;;) {
        const probe = good + step;
        if (probe > hi) {
          if (good === hi || sat(hi)) return hi;
          bad = hi;
          break;
        }
        if (sat(probe)) { good = probe; step *= 2; } else { bad = probe; break; }
      }
    } else {
      bad = start;
      let step = 1;
      for (;;) {
        const probe = bad - step;
        if (probe < lo) {
          if (bad === lo || !sat(lo)) return null;
          good = lo;
          break;
        }
        if (sat(probe)) { good = probe; break; } else { bad = probe; step *= 2; }
      }
    }
    while (bad - good > 1) {
      const mid = good + half(bad - good);
      if (sat(mid)) good = mid; else bad = mid;
    }
    return good;
  }
  /**
   * 反推：滿足 profit ≥ desired 且最接近進場價方向的可掛價（做多＝最低滿足價、做空＝最高滿足價）。
   * 以閉式估計為起點，依檔位（格點序號）修正；比較一律用整數損益。
   */
  function solveCore(ctx, desired) {
    const theo = theoreticalPrice(ctx, Number(desired));
    const sat = (idx) => profitAt(ctx, gridPrice(ctx.table, idx)) >= desired;
    const start = startIndex(ctx, theo);
    let idx;
    let reachable;
    if (ctx.isLong) {
      idx = lowestTrue(sat, start, 0, ctx.idxMax);
      if (idx === null) { idx = ctx.idxMax; reachable = false; }
      // 連最低價 0.01 都「超過」目標 → 門檻不在價格範圍內（例：停損金額大於最大可能虧損）
      else reachable = idx > 0 || profitAt(ctx, 1) === desired;
    } else {
      idx = highestTrue(sat, start, 0, ctx.idxMax);
      if (idx === null) { idx = 0; reachable = false; } // 跌到 0.01 仍不足
      else reachable = idx < ctx.idxMax || profitAt(ctx, gridPrice(ctx.table, ctx.idxMax)) === desired;
    }
    return { pc: gridPrice(ctx.table, idx), theo, reachable };
  }
  function solve(ctx, desired) {
    const core = solveCore(ctx, desired);
    const trade = tradeAt(ctx, core.pc);
    trade.desiredProfit = Number(desired);
    trade.theoreticalPrice = Number.isFinite(core.theo) && core.theo > 0 ? core.theo : null;
    trade.reachable = core.reachable;
    return { trade, pc: core.pc };
  }

  // ════════════════════════════════════════════════════════════════════
  // 13. calculate()
  // ════════════════════════════════════════════════════════════════════
  function fail(errors, bag) {
    return { ok: false, errors, warnings: bag.list };
  }

  function calculateImpl(raw) {
    const bag = makeBag();
    const errors = [];
    const input = raw && typeof raw === 'object' ? raw : {};

    // ── 模式／方向／商品 ──
    const tradeMode = str(input.tradeMode);
    const productType = str(input.productType);
    const mode = Object.prototype.hasOwnProperty.call(MODES, tradeMode) ? MODES[tradeMode] : null;
    const product = Object.prototype.hasOwnProperty.call(PRODUCTS, productType) ? PRODUCTS[productType] : null;
    if (!mode) errors.push({ code: 'INVALID_MODE', field: 'tradeMode', message: `不支援的交易類型「${tradeMode}」` });
    if (!product) errors.push({ code: 'INVALID_PRODUCT', field: 'productType', message: `不支援的商品類型「${productType}」` });
    let direction = str(input.direction);
    if (mode) {
      if (direction === '') direction = mode.directions[0];
      if (direction !== 'long' && direction !== 'short') {
        errors.push({ code: 'INVALID_DIRECTION', field: 'direction', message: `不支援的方向「${direction}」` });
      } else if (mode.directions.indexOf(direction) < 0) {
        const msg = tradeMode === 'cash' ? '現股（非當沖）不可先賣後買；跨日放空請改用融券' : `${mode.label}不支援${direction === 'long' ? '做多' : '做空'}`;
        errors.push({ code: 'INVALID_COMBINATION', field: 'direction', message: msg });
      }
    }

    // ── 進場價 ──
    const ep = readNum(input.entryPrice);
    if (ep.blank) errors.push({ code: 'ENTRY_PRICE_REQUIRED', field: 'entryPrice', message: '請輸入進場價' });
    else if (ep.invalid) errors.push({ code: 'ENTRY_PRICE_INVALID', field: 'entryPrice', message: '進場價格式不正確' });
    else if (ep.dec.n <= 0n || decCmp(ep.dec, BigInt(PRICE_MAX_CENTS), 100n) > 0) {
      errors.push({ code: 'ENTRY_PRICE_OUT_OF_RANGE', field: 'entryPrice', message: '進場價須大於 0 且不超過 100,000 元' });
    }

    // ── 張數 ──
    const lt = readNum(input.lots);
    let lots = 0;
    if (lt.blank) errors.push({ code: 'LOTS_REQUIRED', field: 'lots', message: '請輸入張數' });
    else if (lt.invalid) errors.push({ code: 'LOTS_INVALID', field: 'lots', message: '張數格式不正確' });
    else {
      let x = scaleDec(lt.dec, 0);
      if (x < 1n) {
        errors.push({ code: 'LOTS_OUT_OF_RANGE', field: 'lots', message: '張數須為 1 以上的整數（不支援零股）' });
      } else {
        if (!decIsInt(lt.dec)) bag.add('NON_INTEGER_LOTS', 'warn', `張數 ${decToString(lt.dec)} 不是整數，已四捨五入為 ${x} 張（不支援零股）`, 'lots');
        if (x > BigInt(LOTS_MAX)) {
          bag.add('LOTS_CLAMPED', 'warn', `張數超過上限，已以 ${groupDigits(String(LOTS_MAX))} 張計算`, 'lots');
          x = BigInt(LOTS_MAX);
        }
        lots = Number(x);
      }
    }
    if (errors.length) return fail(errors, bag);

    const isLong = direction === 'long';
    const table = TICK_TABLES[product.tickTable];
    const isML = tradeMode === 'marginLong';
    const isMS = tradeMode === 'marginShort';
    const isCDT = tradeMode === 'creditDayTrade';

    // ── 交易日期 ──
    let tradeDate;
    const td = str(input.tradeDate);
    if (td === '') tradeDate = todayTaipei();
    else {
      tradeDate = normalizeDate(td);
      if (!tradeDate) {
        tradeDate = todayTaipei();
        bag.add('TRADE_DATE_INVALID', 'warn', `交易日期「${td}」格式不正確，已改用今日 ${fmtDateZh(tradeDate)}`, 'tradeDate');
      }
    }

    // ── 進場價對齊檔位 ──
    const entryPc = nearestGridR(table, ep.dec.n * 100n, ep.dec.d);
    const rawEntryPrice = decToNumber(ep.dec);
    const entryPriceAdjusted = BigInt(entryPc) * ep.dec.d !== ep.dec.n * 100n;
    if (entryPriceAdjusted) {
      bag.add('ENTRY_ADJUSTED', 'warn', `進場價 ${decToString(ep.dec)} 不是合法檔位，已調整為 ${fmtPc(entryPc)}（升降單位 ${scaledToPlain(tickAt(table, entryPc), 2)}）`, 'entryPrice');
    }

    // ── 手續費 ──
    const disc = parseDiscountInternal(input.discount);
    if (disc.invalid) bag.add('INPUT_INVALID', 'warn', '手續費折數格式不正確，已改用預設值 1.8 折', 'discount');
    else if (disc.clamped) bag.add('DISCOUNT_CLAMPED', 'warn', `手續費折數超出範圍，已以「${disc.label}」計算`, 'discount');
    else if (disc.adjusted) bag.add('DISCOUNT_ADJUSTED', 'info', `折數 ${str(input.discount)} 視為「${disc.label}」（${scaledToPlain(disc.micro, 6)}）`, 'discount');
    let minFee = 20n;
    {
      const r = readNum(input.minFee);
      if (r.invalid) bag.add('INPUT_INVALID', 'warn', '最低手續費格式不正確，已改用預設值 20 元', 'minFee');
      else if (!r.blank) {
        let x = scaleDec(r.dec, 0);
        if (x < 0n) { bag.add('INPUT_CLAMPED', 'warn', '最低手續費不可為負數，已以 0 元計算', 'minFee'); x = 0n; }
        else if (x > 100000n) { bag.add('INPUT_CLAMPED', 'warn', '最低手續費超過 100,000 元，已以 100,000 元計算', 'minFee'); x = 100000n; }
        else if (!decIsInt(r.dec)) bag.add('INPUT_ROUNDED', 'info', `最低手續費已四捨五入為 ${x} 元`, 'minFee');
        minFee = x;
      }
    }
    const feeModel = cleanEnum(input.feeModel, ['instant', 'monthly'], 'instant', 'feeModel', '折讓模式', bag);
    const taxRounding = cleanEnum(input.taxRounding, ['floor', 'round'], 'floor', 'taxRounding', '證交稅尾數', bag);

    // ── 信用參數（只對相關模式發出警示） ──
    const bML = isML ? bag : DROP;
    const bMS = isMS ? bag : DROP;
    const selfR4 = cleanPercent(input.marginSelfRatio, {
      field: 'marginSelfRatio', label: '融資自備成數', def: '40', scale: 4, min: 4000n, max: 10000n,
      minCode: 'SELF_RATIO_CLAMPED', maxCode: 'SELF_RATIO_CLAMPED',
      minMsg: (x) => `自備成數 ${scaledToPlain(x, 2)}% 低於法定最低 40%（最高融資 6 成），已以 40% 計算`,
      maxMsg: (x) => `自備成數 ${scaledToPlain(x, 2)}% 超過 100%，已以 100% 計算`,
    }, bML);
    const mRate6 = cleanPercent(input.marginInterestRate, {
      field: 'marginInterestRate', label: '融資年利率', def: '6.45', scale: 6, min: 0n, max: R6,
      minMsg: () => '融資年利率不可為負數，已以 0% 計算', maxMsg: () => '融資年利率超過 100%，已以 100% 計算',
    }, bML);
    const mDays = cleanDays(input.marginDays, 'marginDays', '融資天數', bML);
    const shortMin = getMinShortMarginRatio(tradeDate);
    const minR4 = BigInt(shortMarginPeriod(tradeDate).pct) * 100n; // 90% → 9000、130% → 13000（1e-4）
    let smR4;
    let smAuto = false;
    {
      const r = readNum(input.shortMarginRatio);
      if (r.blank) { smR4 = minR4; smAuto = true; }
      else if (r.invalid) {
        bMS.add('INPUT_INVALID', 'warn', `融券保證金成數格式不正確，已改用現行最低 ${fmtRatio(shortMin.ratio)}`, 'shortMarginRatio');
        smR4 = minR4; smAuto = true;
      } else {
        // 使用者明確輸入：低於常態最低 90% → 夾到 90%；介於 90% 與依日期最低值（臨時措施 130%）之間 → 照輸入計算並警示
        //（130% 為未定結束日的臨時措施，硬夾會在措施解除後算錯）
        smR4 = scaleDec(r.dec, 2);
        if (smR4 < SHORT_MARGIN_FLOOR_R4) {
          bMS.add('SHORT_MARGIN_RAISED', 'warn', `融券保證金成數 ${scaledToPlain(smR4, 2)}% 低於法定最低 90%，已以 90% 計算`, 'shortMarginRatio');
          smR4 = SHORT_MARGIN_FLOOR_R4;
        } else if (smR4 > 100000n) {
          bMS.add('INPUT_CLAMPED', 'warn', '融券保證金成數超過 1000%，已以 1000% 計算', 'shortMarginRatio');
          smR4 = 100000n;
        }
        if (smR4 < minR4) {
          bMS.add('SHORT_MARGIN_BELOW_MIN', 'warn', `低於 ${shortMin.from} 起的最低融券保證金成數 ${fmtRatio(shortMin.ratio)}（金管會臨時穩定措施）；除非措施已解除，券商不會接受此成數`, 'shortMarginRatio');
        }
      }
    }
    const sfR8 = cleanPercent(input.shortFeeRate, {
      field: 'shortFeeRate', label: '融券手續費率', def: '0.08', scale: 8, min: 0n, max: 10000000n,
      minMsg: () => '融券手續費率不可為負數，已以 0% 計算', maxMsg: () => '融券手續費率超過 10%，已以 10% 計算',
    }, (isMS || isCDT) ? bag : DROP);
    const sRate6 = cleanPercent(input.shortInterestRate, {
      field: 'shortInterestRate', label: '融券擔保品年利率', def: '0.2', scale: 6, min: 0n, max: R6,
      minMsg: () => '融券擔保品年利率不可為負數，已以 0% 計算', maxMsg: () => '融券擔保品年利率超過 100%，已以 100% 計算',
    }, bMS);
    const sDays = cleanDays(input.shortDays, 'shortDays', '融券天數', bMS);
    if (isML && mDays > 180) bag.add('DAYS_OVER_180', 'info', `融資天數 ${mDays} 天超過 180 天：信用交易期限 6 個月，可展延 2 次（最長 18 個月）`, 'marginDays');
    if (isMS && sDays > 180) bag.add('DAYS_OVER_180', 'info', `融券天數 ${sDays} 天超過 180 天：信用交易期限 6 個月，可展延 2 次（最長 18 個月）`, 'shortDays');

    // ── 證交稅 ──
    // 融資的證交稅在融資賣出時收取：依「出場日＝交易日期＋融資天數（日曆日）」判斷依日期而變的規則（債券ETF 停徵；當沖降稅不適用信用交易）。
    // 融券、資券當沖、現股當沖的稅在進場或當日收取，依交易日期；現股（非當沖）不知出場日，仍依交易日期。
    const taxBasis = isML ? 'exit' : 'trade';
    const taxDate = isML ? addDaysIso(tradeDate, mDays) : tradeDate;
    const tax = resolveTaxInternal(productType, tradeMode, taxDate, input.taxRateOverride);
    let crossing = null;
    if (isML && !tax.overridden && taxDate !== tradeDate) {
      const atTrade = resolveTaxInternal(productType, tradeMode, tradeDate, '');
      if (atTrade.n * tax.d !== tax.n * atTrade.d) {
        let reason = '證交稅規則與交易日期不同';
        let tail = '';
        if (productType === 'bondEtf' && taxDate > BOND_ETF_EXEMPTION.to) {
          reason = `已超過債券ETF 停徵期限 ${BOND_ETF_EXEMPTION.to}`;
          tail = '（延長案待立法院三讀，可於進階設定覆寫稅率）';
        } else if (productType === 'bondEtf' && tradeDate < BOND_ETF_EXEMPTION.from) {
          reason = `已進入債券ETF 停徵期間（${BOND_ETF_EXEMPTION.from} 起）`;
        }
        crossing = `融資賣出日約 ${taxDate}，${reason}，出場證交稅以 ${ratePctLabel(tax.n, tax.d)} 計${tail}`;
      }
    }
    tax.warnings.forEach((w) => {
      // 跨越停徵期限時由 TAX_RULE_CHANGES_BEFORE_EXIT 說明，不重複列出一般的「停徵期限已到」
      if (crossing && w.code === 'BOND_ETF_EXEMPTION_ENDED') return;
      bag.add(w.code, w.level, w.message, w.field);
    });
    if (crossing) bag.add('TAX_RULE_CHANGES_BEFORE_EXIT', 'warn', crossing, 'marginDays');
    if (tradeMode === 'cash' && productType === 'bondEtf' && !tax.overridden
      && tradeDate >= BOND_ETF_EXEMPTION.from && tradeDate <= BOND_ETF_EXEMPTION.to && addDaysIso(tradeDate, 90) >= BOND_ETF_EXEMPTION.to) {
      bag.add('BOND_ETF_EXEMPTION_EXPIRING', 'info', `債券ETF 證交稅停徵至 ${BOND_ETF_EXEMPTION.to}；若於 ${Number(BOND_ETF_EXEMPTION.to.slice(0, 4)) + 1} 年以後賣出，稅率依屆時法規（延長案待三讀）`, 'tradeDate');
    }

    // ── 參考價與漲跌停 ──
    let limits = null;
    let limitsCents = null;
    let refClean = null;
    let limitPctClean = null;
    {
      const r = readNum(input.refPrice);
      const lp = parseLimitPct(input.limitPct);
      if (lp.none) limitPctClean = null;
      else if (lp.invalid) limitPctClean = 0.1;
      else limitPctClean = decToNumber(lp.dec);
      if (!r.blank) {
        if (r.invalid || r.dec.n <= 0n || decCmp(r.dec, BigInt(PRICE_MAX_CENTS), 100n) > 0) {
          bag.add('REF_PRICE_INVALID', 'warn', '參考價須大於 0 且不超過 100,000 元，已忽略漲跌停計算', 'refPrice');
        } else {
          const refPc = nearestGridR(table, r.dec.n * 100n, r.dec.d);
          if (BigInt(refPc) * r.dec.d !== r.dec.n * 100n) {
            bag.add('REF_ADJUSTED', 'warn', `參考價 ${decToString(r.dec)} 不是合法檔位，已調整為 ${fmtPc(refPc)}`, 'refPrice');
          }
          refClean = refPc / 100;
          if (lp.invalid) bag.add('INPUT_INVALID', 'warn', '漲跌幅設定不正確，已改用 10%', 'limitPct');
          if (!lp.none) {
            const L = lp.invalid ? { n: 1n, d: 10n } : lp.dec;
            limitsCents = priceLimitsCents(table, { n: BigInt(refPc), d: 1n }, L);
            limits = { refPrice: refPc / 100, limitUp: limitsCents.upPc / 100, limitDown: limitsCents.downPc / 100, limitPct: decToNumber(L) };
          }
        }
      }
    }

    // ── 建立計算脈絡（BigInt） ──
    const lotsB = BigInt(lots);
    const shares = lots * 1000;
    const G = BigInt(entryPc) * lotsB * 10n; // 成交金額（元）= 價格(分) × 股數 / 100
    const ec = commissionB(G, disc.micro, minFee, feeModel);
    const entryHasTax = !isLong;
    const entryHasShortFee = isMS || (isCDT && !isLong);
    const etax = entryHasTax ? taxB(G, tax.n, tax.d, taxRounding) : 0n;
    const esf = entryHasShortFee ? divRoundHalfUp(G * sfR8, R8) : 0n;
    let loan = 0n; let selfFunds = 0n; let collateral = 0n; let guaranty = 0n;
    let interestCost = 0n; let interestIncome = 0n;
    if (isML) {
      loan = divFloor(G * (R4 - selfR4), R4 * 1000n) * 1000n;
      selfFunds = G - loan;
      interestCost = divRoundHalfUp(loan * mRate6 * BigInt(mDays), R6 * 365n);
    } else if (isMS) {
      collateral = divCeil(G * smR4, R4 * 100n) * 100n;
      guaranty = G - ec.charged - etax - esf;
      interestIncome = divRoundHalfUp((collateral + guaranty) * sRate6 * BigInt(sDays), R6 * 365n);
    }
    const entryCostsNet = ec.net + etax + esf;

    let cashOut; let cashIn = 0n; let capitalBase; let capitalBaseLabel; let returnRateLabel = '報酬率';
    if (isML) {

  const sb = saved && saved.shared && typeof saved.shared === 'object' ? saved.shared.backup : null;
  let shared = sb && typeof sb === 'object' ? { backup: Object.assign({}, DEFAULTS, sanitizeInputs(sb)) } : null;
  const fromHash = parseHash(window.location.hash);
  if (fromHash) {
    if (!shared) shared = { backup: inputs }; // 連續開啟多條連結時保留「最初」的設定
    inputs = Object.assign({}, DEFAULTS, fromHash);
  }
  return {
    inputs,
    ui: sanitizeUi(saved && saved.ui),
    dismissed: sanitizeDismissed(saved && saved.dismissed),
    shared,
  };
}

// ── 環境偵測 ─────────────────────────────────────────────────────────
function mq(q) {
  try { return !!(window.matchMedia && window.matchMedia(q).matches); } catch (e) { return false; }
}
const IS_IOS = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_STANDALONE = window.navigator.standalone === true || mq('(display-mode: standalone)');
const prefersReducedMotion = () => mq('(prefers-reduced-motion: reduce)');

function useMedia(query) {
  const [match, setMatch] = useState(() => mq(query));
  useEffect(() => {
    if (!window.matchMedia) return undefined;
    const m = window.matchMedia(query);
    const on = () => setMatch(m.matches);
    on();
    if (m.addEventListener) m.addEventListener('change', on); else m.addListener(on);
    return () => { if (m.removeEventListener) m.removeEventListener('change', on); else m.removeListener(on); };
  }, [query]);
  return match;
}

// ── 複製（clipboard → textarea + execCommand） ─────────────────────────
function legacyCopy(text) {
  let ok = false;
  const ta = document.createElement('textarea');
  try {
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;';
    document.body.appendChild(ta);
    ta.focus({ preventScroll: true });
    ta.select();
    ta.setSelectionRange(0, text.length);
    ok = document.execCommand('copy');
  } catch (e) {
    ok = false;
  }
  try { document.body.removeChild(ta); } catch (e) { /* 忽略 */ }
  return ok;
}
function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(() => true, () => legacyCopy(text));
    }
  } catch (e) { /* 改用舊方法 */ }
  return Promise.resolve(legacyCopy(text));
}

function Segmented({ idBase, labelledBy, ariaLabel, options, value, onChange, variant, haptic, tall }) {
  const refs = useRef([]);
  const found = options.findIndex((o) => o.value === value);
  const idx = found < 0 ? 0 : found;
  const isTabs = variant === 'tabs';
  const go = (i) => {
    const n = options.length;
    const j = ((i % n) + n) % n;
    if (options[j].value !== value) onChange(options[j].value);
    const el = refs.current[j];
    if (el) el.focus();
  };
  const onKey = (e, i) => {
    const k = e.key;
    if (k === 'ArrowRight' || k === 'ArrowDown') go(i + 1);
    else if (k === 'ArrowLeft' || k === 'ArrowUp') go(i - 1);
    else if (k === 'Home') go(0);
    else if (k === 'End') go(options.length - 1);
    else return;
    e.preventDefault();
  };
  return (
    <div className={'seg' + (tall ? ' seg-tall' : '')} role={isTabs ? 'tablist' : 'radiogroup'}
      aria-labelledby={labelledBy} aria-label={labelledBy ? undefined : ariaLabel}

      <span className="seg-ind" aria-hidden="true" />

        const sel = i === idx;
        return (
          <button key={o.value} ref={(el) => { refs.current[i] = el; }} type="button" id={idBase + '-' + o.value}
            role={isTabs ? 'tab' : 'radio'}
            aria-checked={isTabs ? undefined : sel}
            aria-selected={isTabs ? sel : undefined}
            aria-controls={isTabs ? idBase + '-panel' : undefined}
            tabIndex={sel ? 0 : -1}

            onKeyDown={(e) => onKey(e, i)}>
            {haptic !== false && <Haptic />}

// 欄位 → 輸入框 id（「套用」等動作完成後的焦點目標）
const FIELD_INPUT_IDS = {

  marginSelfRatio: 'f-mself', marginInterestRate: 'f-mrate', marginDays: 'f-mdays', shortMarginRatio: 'f-sratio',
  shortFeeRate: 'f-sfee', shortInterestRate: 'f-srate', shortDays: 'f-sdays', refPrice: 'f-ref', tradeDate: 'f-date',
  taxRateOverride: 'f-taxov', targets: 'f-targets',

// 會讓自身卸載的按鈕（一鍵套用、清除、改回自動、關閉提示…）：若焦點在按鈕上（鍵盤／輔助技術），
// 動作後把焦點移到相關輸入框或穩定容器，避免焦點掉回 <body>。
// 觸控點擊不移動焦點：iOS 點擊不會聚焦按鈕；Android 觸控則略過，以免彈出鍵盤。
function keepFocus(e, targetId) {
  const btn = e && e.currentTarget;
  if (!btn || document.activeElement !== btn) return;
  if (e.nativeEvent && e.nativeEvent.pointerType === 'touch') return;
  window.setTimeout(() => {
    const el = document.getElementById(targetId);
    if (el) { try { el.focus({ preventScroll: true }); } catch (err) { /* 忽略 */ } }
  }, 0);
}

function focusNext(currentId) {
  const i = ENTER_ORDER.indexOf(currentId);
  const next = i >= 0 ? ENTER_ORDER[i + 1] : null;
  const el = next ? document.getElementById(next) : null;
  if (el) el.focus();
  else { const cur = document.getElementById(currentId); if (cur) cur.blur(); }
}

// ── 欄位訊息（引擎 errors/warnings 依 field 分配；附「套用」動作） ───────────
const INVALID_CODES = { INPUT_INVALID: 1, EXIT_INVALID: 1, REF_PRICE_INVALID: 1, STOP_LOSS_INVALID: 1, TAX_OVERRIDE_INVALID: 1, TRADE_DATE_INVALID: 1, TARGETS_INVALID: 1 };
function buildFieldMsgs(result, setField) {
  const map = {};
  const actionSeen = {};
  const add = (f, m) => { (map[f] || (map[f] = [])).push(m); };
  if (!result.ok) {
    (result.errors || []).forEach((e) => {
      if (e.field && e.code !== 'ENTRY_PRICE_REQUIRED') add(e.field, { kind: 'error', code: e.code, text: e.message, invalid: true });
    });
  }
  (result.warnings || []).forEach((w) => {
    if (!w.field) return;
    const m = { kind: w.level === 'warn' ? 'warn' : 'info', code: w.code, text: w.message, invalid: !!INVALID_CODES[w.code] };
    const set = (k, v, label) => {
      const key = k + '|' + v;
      if (actionSeen[key]) return; // 同一欄位同一動作只放一個按鈕（例：成數同時低於 90% 與臨時最低值）
      actionSeen[key] = true;
      m.action = { label, run: (e) => { setField(k, v); keepFocus(e, FIELD_INPUT_IDS[k]); } };
    };
    if (result.ok) {
      if (w.code === 'ENTRY_ADJUSTED') set('entryPrice', fmtInputPrice(result.entryPrice), '套用 ' + priceText(result.entryPrice));
      else if (w.code === 'EXIT_ADJUSTED' && result.manualExit) set('exitPrice', fmtInputPrice(result.manualExit.exitPrice), '套用 ' + priceText(result.manualExit.exitPrice));
      else if (w.code === 'REF_ADJUSTED' && result.inputs.refPrice != null) set('refPrice', fmtInputPrice(result.inputs.refPrice), '套用');
      else if (w.code === 'SELF_RATIO_CLAMPED') set('marginSelfRatio', pctInput(result.inputs.marginSelfRatio), '改為 ' + pctInput(result.inputs.marginSelfRatio) + '%');
      else if (w.code === 'SHORT_MARGIN_RAISED' || w.code === 'SHORT_MARGIN_BELOW_MIN') set('shortMarginRatio', '', '改用自動');
      else if (w.code === 'NON_INTEGER_LOTS' || w.code === 'LOTS_CLAMPED') set('lots', String(result.lots), '改為 ' + intText(result.lots) + ' 張');
      else if (w.code === 'DAYS_ROUNDED' && result.inputs[w.field] != null) set(w.field, String(result.inputs[w.field]), '改為 ' + result.inputs[w.field] + ' 天');
    } else if (w.code === 'NON_INTEGER_LOTS' || w.code === 'LOTS_CLAMPED') {
      // 失敗時沒有清洗後的張數，不提供套用
    }
    add(w.field, m);
  });
  return map;
}

function buildShareText(r, inputs) {
  const lines = ['台股當沖・融資融券計算機'];

  const prod = T.PRODUCTS[inputs.productType] || T.PRODUCTS.stock;
