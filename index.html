<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>當沖 / 融資融券計算機</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-100 text-zinc-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useMemo, useState } = React;

        const PRODUCT_CONFIG = {
            stock: {
                label: '個股',
                unitLabel: '股',
                taxRate: 0.0015,
            },
            etf: {
                label: 'ETF',
                unitLabel: '單位',
                taxRate: 0.0010,
            },
        };

        const BASE_FEE_RATE = 0.001425;
        const NON_DAY_TRADE_STOCK_TAX_RATE = 0.003;
        const DEFAULT_TARGETS = '3, 2.5, 2, 1, 0, -1, -2';
        const DEFAULT_LADDER_STEPS = 10;
        const LADDER_STEP_INCREMENT = 5;

        // 融資融券預設值
        const DEFAULT_MARGIN_SELF_RATIO = '40'; // 自備款預設 40%
        const DEFAULT_MARGIN_INTEREST_RATE = '4'; // 融資年利率預設 4%
        const DEFAULT_MARGIN_DAYS = '30'; // 融資天數預設 30 天
        const DEFAULT_SHORT_MARGIN_RATIO = '90'; // 融券保證金預設 90%
        const DEFAULT_SHORT_FEE_RATE = '0.08'; // 融券手續費 (借券費率) 0.08%
        const DEFAULT_SHORT_INTEREST_RATE = '0.1'; // 融券保證金與擔保金年利率 0.1%
        const DEFAULT_SHORT_DAYS = '30'; // 融券天數預設 30 天

        function clamp(value, min, max) {
            return Math.min(max, Math.max(min, value));
        }

        function parseNumber(value, fallback = 0) {
            const parsed = parseFloat(value);
            return Number.isFinite(parsed) ? parsed : fallback;
        }

        function normalizePrice(value) {
            return Number((Math.max(0.01, value)).toFixed(2));
        }

        function getTickSize(price, productType) {
            if (productType === 'etf') {
                return price < 50 ? 0.01 : 0.05;
            }

            if (price < 10) return 0.01;
            if (price < 50) return 0.05;
            if (price < 100) return 0.10;
            if (price < 500) return 0.50;
            if (price < 1000) return 1.00;
            return 5.00;
        }

        function roundToTick(price, productType, mode = 'nearest') {
            if (!Number.isFinite(price) || price <= 0) return null;

            let rounded = price;
            for (let i = 0; i < 6; i += 1) {
                const tick = getTickSize(rounded, productType);
                const ratio = price / tick;

                if (mode === 'ceil') {
                    rounded = Math.ceil(ratio - 1e-9) * tick;
                } else if (mode === 'floor') {
                    rounded = Math.floor(ratio + 1e-9) * tick;
                } else {
                    rounded = Math.round(ratio) * tick;
                }
            }

            return normalizePrice(rounded);
        }

        function addTick(price, direction, productType) {
            const referencePrice = direction > 0
                ? price + 0.000001
                : Math.max(0.01, price - 0.000001);
            const next = price + (getTickSize(referencePrice, productType) * direction);
            return normalizePrice(next);
        }

        function countTicksBetween(fromPrice, toPrice, productType) {
            const from = roundToTick(fromPrice, productType, 'nearest');
            const to = roundToTick(toPrice, productType, 'nearest');
            if (!from || !to || from === to) return 0;

            const direction = to > from ? 1 : -1;
            let price = from;
            let ticks = 0;

            while (
                ((direction > 0 && price < to - 1e-9) || (direction < 0 && price > to + 1e-9))
                && Math.abs(ticks) < 50000
            ) {
                price = addTick(price, direction, productType);
                ticks += direction;
            }

            return ticks;
        }

        function parseTargets(input) {
            return String(input)
                .split(/[,\s，、]+/)
                .map((item) => parseFloat(item))
                .filter((item) => Number.isFinite(item))
                .slice(0, 12)
                .map((item) => item / 100);
        }

        function calculateCommission(value, feeRate, minimumFee) {
            if (value <= 0 || feeRate <= 0) return 0;
            return Math.max(Math.floor(value * feeRate), minimumFee);
        }

        function calculateTax(value, taxRate) {
            if (value <= 0 || taxRate <= 0) return 0;
            return Math.round(value * taxRate);
        }

        function resolveTaxRate(productType, tradeMode, days = 0) {
            if (productType === 'etf') {
                return PRODUCT_CONFIG.etf.taxRate;
            }

            if (tradeMode === 'dayTrade') {
                return PRODUCT_CONFIG.stock.taxRate;
            }

            if (tradeMode === 'marginLong' || tradeMode === 'marginShort') {
                return days === 0 ? PRODUCT_CONFIG.stock.taxRate : NON_DAY_TRADE_STOCK_TAX_RATE;
            }

            return NON_DAY_TRADE_STOCK_TAX_RATE;
        }

        function calculateEntry({
            entryPrice,
            shares,
            direction,
            tradeMode,
            feeRate,
            taxRate,
            minimumFee,
            marginSelfRatio,
            shortMarginRatio,
            productType,
        }) {
            const gross = entryPrice * shares;
            const commission = calculateCommission(gross, feeRate, minimumFee);
            const tax = direction === 'short' ? calculateTax(gross, taxRate) : 0;

            let marginLoan = 0;
            let selfMargin = 0;
            let shortCollateral = 0;
            let shortGuarantyFund = 0;
            let amount = 0;
            let marginCallPrice = null;
            let initialMaintenanceRatio = null;

            if (tradeMode === 'marginLong') {
                const loanRatio = 1 - marginSelfRatio;
                // 台股融資金額以千元為單位，未滿千元無條件捨去
                marginLoan = Math.floor((gross * loanRatio) / 1000) * 1000;
                selfMargin = gross - marginLoan;
                amount = selfMargin + commission;
                initialMaintenanceRatio = marginLoan > 0 ? (gross / marginLoan) * 100 : 0;
                // 融資 130% 追繳線: (市價 * 股數) / 融資金額 = 1.30 -> 市價 = (融資金額 * 1.30) / 股數
                marginCallPrice = marginLoan > 0 ? roundToTick((marginLoan * 1.30) / shares, productType, 'ceil') : null;
            } else if (tradeMode === 'marginShort') {
                // 台股融券保證金以百元為單位無條件進位
                shortCollateral = Math.ceil((gross * shortMarginRatio) / 100) * 100;
                shortGuarantyFund = gross - commission - tax;
                amount = shortCollateral + commission + tax;
                initialMaintenanceRatio = gross > 0 ? ((shortCollateral + shortGuarantyFund) / gross) * 100 : 0;
                // 融券 130% 追繳線: (保證金 + 擔保金) / (市價 * 股數) = 1.30 -> 市價 = (保證金 + 擔保金) / (1.30 * 股數)
                marginCallPrice = shares > 0 ? roundToTick((shortCollateral + shortGuarantyFund) / (1.30 * shares), productType, 'floor') : null;
            } else {
                amount = direction === 'long'
                    ? gross + commission
                    : gross - commission - tax;
            }

            return {
                gross,
                commission,
                tax,
                amount,
                marginLoan,
                selfMargin,
                shortCollateral,
                shortGuarantyFund,
                initialMaintenanceRatio,
                marginCallPrice,
            };
        }

        function calculateRoundTrip({
            entry,
            entryPrice,
            exitPrice,
            shares,
            direction,
            tradeMode,
            feeRate,
            taxRate,
            minimumFee,
            marginInterestRate = 0.04,
            marginDays = 30,
            shortFeeRate = 0.0008,
            shortInterestRate = 0.001,
            shortDays = 30,
            productType = 'stock',
        }) {
            const exitGross = exitPrice * shares;
            const exitCommission = calculateCommission(exitGross, feeRate, minimumFee);
            const exitTax = direction === 'long' ? calculateTax(exitGross, taxRate) : 0;

            let grossProfit = 0;
            let totalFeesAndTax = 0;
            let profit = 0;
            let exitAmount = 0;
            let marginInterest = 0;
            let shortFee = 0;
            let shortInterest = 0;
            let maintenanceRatio = null;

            if (tradeMode === 'marginLong') {
                marginInterest = (entry.marginLoan > 0 && marginDays > 0)
                    ? Math.round(entry.marginLoan * (marginInterestRate / 365) * marginDays)
                    : 0;
                grossProfit = exitGross - entry.gross;
                totalFeesAndTax = entry.commission + exitCommission + exitTax + marginInterest;
                profit = grossProfit - totalFeesAndTax;
                // 融資賣出結算入帳退款
                exitAmount = exitGross - exitCommission - exitTax - entry.marginLoan - marginInterest;
                maintenanceRatio = entry.marginLoan > 0 ? (exitGross / entry.marginLoan) * 100 : 0;
            } else if (tradeMode === 'marginShort') {
                shortFee = Math.round(entry.gross * shortFeeRate);
                shortInterest = (shortDays > 0)
                    ? Math.round((entry.shortCollateral + entry.shortGuarantyFund) * (shortInterestRate / 365) * shortDays)
                    : 0;
                grossProfit = entry.gross - exitGross;
                totalFeesAndTax = entry.commission + entry.tax + exitCommission + shortFee - shortInterest;
                profit = grossProfit - totalFeesAndTax;
                // 融券買進回補結算退回保證金與損益
                exitAmount = entry.shortCollateral + entry.shortGuarantyFund - exitGross - exitCommission - shortFee + shortInterest;
                maintenanceRatio = exitGross > 0 ? ((entry.shortCollateral + entry.shortGuarantyFund) / exitGross) * 100 : 0;
            } else {
                if (direction === 'long') {
                    grossProfit = exitGross - entry.gross;
                    totalFeesAndTax = entry.commission + exitCommission + exitTax;
                    exitAmount = exitGross - exitCommission - exitTax;
                    profit = exitAmount - entry.amount;
                } else {
                    grossProfit = entry.gross - exitGross;
                    totalFeesAndTax = entry.commission + entry.tax + exitCommission;
                    exitAmount = exitGross + exitCommission;
                    profit = entry.amount - exitAmount;
                }
            }

            const returnRate = entry.amount > 0 ? profit / entry.amount : 0;
            const nominalReturnRate = entry.gross > 0 ? (direction === 'long' ? exitGross - entry.gross : entry.gross - exitGross) / entry.gross : 0;

            return {
                entry,
                exitGross,
                exitCommission,
                exitTax,
                marginInterest,
                shortFee,
                shortInterest,
                grossProfit,
                totalFeesAndTax,
                exitAmount,
                profit,
                returnRate,
                nominalReturnRate,
                maintenanceRatio,
            };
        }

        function estimateExitPrice({
            entry,
            desiredProfit,
            shares,
            direction,
            tradeMode,
            feeRate,
            taxRate,
            marginInterestRate,
            marginDays,
            shortFeeRate,
            shortInterestRate,
            shortDays,
        }) {
            if (tradeMode === 'marginLong') {
                const marginInterest = (entry.marginLoan > 0 && marginDays > 0)
                    ? Math.round(entry.marginLoan * (marginInterestRate / 365) * marginDays)
                    : 0;
                return (entry.gross + entry.commission + marginInterest + desiredProfit) / (shares * (1 - feeRate - taxRate));
            }

            if (tradeMode === 'marginShort') {
                const shortFee = Math.round(entry.gross * shortFeeRate);
                const shortInterest = (shortDays > 0)
                    ? Math.round((entry.shortCollateral + entry.shortGuarantyFund) * (shortInterestRate / 365) * shortDays)
                    : 0;
                return (entry.gross - entry.commission - entry.tax - shortFee + shortInterest - desiredProfit) / (shares * (1 + feeRate));
            }

            if (direction === 'long') {
                return (entry.amount + desiredProfit) / (shares * (1 - feeRate - taxRate));
            }

            return (entry.amount - desiredProfit) / (shares * (1 + feeRate));
        }

        function settleExitPriceForProfit(params) {
            const {
                entry,
                entryPrice,
                shares,
                productType,
                direction,
                tradeMode,
                feeRate,
                taxRate,
                minimumFee,
                marginInterestRate,
                marginDays,
                shortFeeRate,
                shortInterestRate,
                shortDays,
                desiredProfit,
            } = params;

            const estimate = estimateExitPrice(params);
            const mode = direction === 'long' ? 'ceil' : 'floor';
            let price = roundToTick(estimate, productType, mode) || 0.01;

            const tripParams = {
                entry,
                entryPrice,
                exitPrice: price,
                shares,
                direction,
                tradeMode,
                feeRate,
                taxRate,
                minimumFee,
                marginInterestRate,
                marginDays,
                shortFeeRate,
                shortInterestRate,
                shortDays,
                productType,
            };

            let trade = calculateRoundTrip(tripParams);
            let guard = 0;

            while (trade.profit < desiredProfit && guard < 50000) {
                const nextPrice = addTick(price, direction === 'long' ? 1 : -1, productType);
                if (nextPrice === price) break;

                price = nextPrice;
                tripParams.exitPrice = price;
                trade = calculateRoundTrip(tripParams);
                guard += 1;
            }

            while (guard < 100000) {
                const nextPrice = addTick(price, direction === 'long' ? -1 : 1, productType);
                if (nextPrice === price || nextPrice <= 0) break;

                tripParams.exitPrice = nextPrice;
                const nextTrade = calculateRoundTrip(tripParams);
                if (nextTrade.profit < desiredProfit) break;

                price = nextPrice;
                trade = nextTrade;
                guard += 1;
            }

            return {
                theoreticalPrice: estimate,
                exitPrice: price,
                ticks: countTicksBetween(entryPrice, price, productType),
                ...trade,
            };
        }

        function calculateDayTrade({
            direction,
            tradeMode,
            productType,
            lots,
            entryPriceInput,
            exitPriceInput,
            stopLossInput,
            discountInput,
            minimumFeeInput,
            targetInput,
            marginSelfRatioInput,
            marginInterestRateInput,
            marginDaysInput,
            shortMarginRatioInput,
            shortFeeRateInput,
            shortInterestRateInput,
            shortDaysInput,
        }) {
            const rawEntryPrice = parseNumber(entryPriceInput, NaN);
            const parsedLots = parseInt(lots, 10);
            const validLots = Number.isFinite(parsedLots) && parsedLots > 0 ? parsedLots : 0;

            if (!Number.isFinite(rawEntryPrice) || rawEntryPrice <= 0 || validLots <= 0) {
                return null;
            }

            const product = PRODUCT_CONFIG[productType];
            const discount = clamp(parseNumber(discountInput, 1), 0, 1);
            const minimumFee = Math.max(0, Math.round(parseNumber(minimumFeeInput, 0)));
            const feeRate = BASE_FEE_RATE * discount;

            // 融資融券參數解析
            const marginSelfRatio = clamp(parseNumber(marginSelfRatioInput, 40) / 100, 0.1, 1.0);
            const marginInterestRate = Math.max(0, parseNumber(marginInterestRateInput, 4) / 100);
            const marginDays = Math.max(0, Math.round(parseNumber(marginDaysInput, 30)));

            const shortMarginRatio = clamp(parseNumber(shortMarginRatioInput, 90) / 100, 0.1, 2.0);
            const shortFeeRate = Math.max(0, parseNumber(shortFeeRateInput, 0.08) / 100);
            const shortInterestRate = Math.max(0, parseNumber(shortInterestRateInput, 0.1) / 100);
            const shortDays = Math.max(0, Math.round(parseNumber(shortDaysInput, 30)));

            const holdingDays = tradeMode === 'marginLong' ? marginDays : (tradeMode === 'marginShort' ? shortDays : 0);
            const taxRate = resolveTaxRate(productType, tradeMode, holdingDays);
            const entryPrice = roundToTick(rawEntryPrice, productType, 'nearest');
            const shares = validLots * 1000;

            const entry = calculateEntry({
                entryPrice,
                shares,
                direction,
                tradeMode,
                feeRate,
                taxRate,
                minimumFee,
                marginSelfRatio,
                shortMarginRatio,
                productType,
            });

            const targetRates = parseTargets(targetInput);
            const targetRows = targetRates.map((rate) => {
                const desiredProfit = entry.amount * rate;
                const settled = settleExitPriceForProfit({
                    entry,
                    entryPrice,
                    shares,
                    productType,
                    direction,
                    tradeMode,
                    feeRate,
                    taxRate,
                    minimumFee,
                    marginInterestRate,
                    marginDays,
                    shortFeeRate,
                    shortInterestRate,
                    shortDays,
                    desiredProfit,
                });

                return {
                    rate,
                    desiredProfit,
                    actualRate: entry.amount > 0 ? settled.profit / entry.amount : 0,
                    ...settled,
                };
            });

            const breakEven = settleExitPriceForProfit({
                entry,
                entryPrice,
                shares,
                productType,
                direction,
                tradeMode,
                feeRate,
                taxRate,
                minimumFee,
                marginInterestRate,
                marginDays,
                shortFeeRate,
                shortInterestRate,
                shortDays,
                desiredProfit: 0,
            });

            const stopLossAmount = parseNumber(stopLossInput, 0);
            const stopLoss = stopLossAmount > 0
                ? settleExitPriceForProfit({
                    entry,
                    entryPrice,
                    shares,
                    productType,
                    direction,
                    tradeMode,
                    feeRate,
                    taxRate,
                    minimumFee,
                    marginInterestRate,
                    marginDays,
                    shortFeeRate,
                    shortInterestRate,
                    shortDays,
                    desiredProfit: -Math.abs(stopLossAmount),
                })
                : null;

            const rawExitPrice = parseNumber(exitPriceInput, NaN);
            const manualExitPrice = Number.isFinite(rawExitPrice) && rawExitPrice > 0
                ? roundToTick(rawExitPrice, productType, 'nearest')
                : null;

            const manualExit = manualExitPrice
                ? {
                    exitPrice: manualExitPrice,
                    ticks: countTicksBetween(entryPrice, manualExitPrice, productType),
                    ...calculateRoundTrip({
                        entry,
                        entryPrice,
                        exitPrice: manualExitPrice,
                        shares,
                        direction,
                        tradeMode,
                        feeRate,
                        taxRate,
                        minimumFee,
                        marginInterestRate,
                        marginDays,
                        shortFeeRate,
                        shortInterestRate,
                        shortDays,
                        productType,
                    }),
                }
                : null;

            return {
                product,
                direction,
                tradeMode,
                productType,
                lots: validLots,
                shares,
                entryPrice,
                rawEntryPrice,
                entryPriceAdjusted: Math.abs(entryPrice - rawEntryPrice) > 0.000001,
                entryTick: getTickSize(entryPrice, productType),
                feeRate,
                taxRate,
                discount,
                minimumFee,
                marginSelfRatio,
                marginInterestRate,
                marginDays,
                shortMarginRatio,
                shortFeeRate,
                shortInterestRate,
                shortDays,
                entry,
                breakEven,
                stopLoss,
                manualExit,
                targetRows,
            };
        }

        function buildPriceLadder({
            entryPrice,
            entry,
            shares,
            direction,
            tradeMode,
            productType,
            feeRate,
            taxRate,
            minimumFee,
            marginInterestRate,
            marginDays,
            shortFeeRate,
            shortInterestRate,
            shortDays,
            upwardLevels,
            downwardLevels,
        }) {
            const upperRows = [];
            let nextUpperPrice = entryPrice;

            for (let level = 0; level < upwardLevels; level += 1) {
                nextUpperPrice = addTick(nextUpperPrice, 1, productType);
                const trade = calculateRoundTrip({
                    entry,
                    entryPrice,
                    exitPrice: nextUpperPrice,
                    shares,
                    direction,
                    tradeMode,
                    feeRate,
                    taxRate,
                    minimumFee,
                    marginInterestRate,
                    marginDays,
                    shortFeeRate,
                    shortInterestRate,
                    shortDays,
                    productType,
                });
                upperRows.push({
                    price: nextUpperPrice,
                    ticks: countTicksBetween(entryPrice, nextUpperPrice, productType),
                    returnRate: entry.amount > 0 ? trade.profit / entry.amount : 0,
                    ...trade,
                });
            }

            const lowerRows = [];
            let nextLowerPrice = entryPrice;

            for (let level = 0; level < downwardLevels; level += 1) {
                const candidatePrice = addTick(nextLowerPrice, -1, productType);
                if (!candidatePrice || candidatePrice <= 0 || candidatePrice === nextLowerPrice) {
                    break;
                }

                nextLowerPrice = candidatePrice;
                const trade = calculateRoundTrip({
                    entry,
                    entryPrice,
                    exitPrice: nextLowerPrice,
                    shares,
                    direction,
                    tradeMode,
                    feeRate,
                    taxRate,
                    minimumFee,
                    marginInterestRate,
                    marginDays,
                    shortFeeRate,
                    shortInterestRate,
                    shortDays,
                    productType,
                });
                lowerRows.push({
                    price: nextLowerPrice,
                    ticks: countTicksBetween(entryPrice, nextLowerPrice, productType),
                    returnRate: entry.amount > 0 ? trade.profit / entry.amount : 0,
                    ...trade,
                });
            }

            const centerTrade = calculateRoundTrip({
                entry,
                entryPrice,
                exitPrice: entryPrice,
                shares,
                direction,
                tradeMode,
                feeRate,
                taxRate,
                minimumFee,
                marginInterestRate,
                marginDays,
                shortFeeRate,
                shortInterestRate,
                shortDays,
                productType,
            });

            return {
                upperRows,
                lowerRows,
                centerRow: {
                    price: entryPrice,
                    ticks: 0,
                    returnRate: entry.amount > 0 ? centerTrade.profit / entry.amount : 0,
                    ...centerTrade,
                },
            };
        }

        function formatCurrency(value) {
            return Math.round(value).toLocaleString('zh-TW');
        }

        function formatSignedCurrency(value) {
            const sign = value > 0 ? '+' : value < 0 ? '-' : '';
            return `${sign}${formatCurrency(Math.abs(value))}`;
        }

        function formatPrice(value) {
            if (!Number.isFinite(value)) return '--';
            return Number(value).toLocaleString('zh-TW', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2,
            });
        }

        function formatPercent(value) {
            return `${(value * 100).toFixed(Math.abs(value * 100) >= 10 ? 1 : 2)}%`;
        }

        function profitClass(value) {
            if (value > 0) return 'text-red-600';
            if (value < 0) return 'text-emerald-700';
            return 'text-zinc-700';
        }

        function priceClass(entryPrice, exitPrice) {
            if (exitPrice > entryPrice) return 'text-red-600';
            if (exitPrice < entryPrice) return 'text-emerald-700';
            return 'text-zinc-700';
        }

        function tickLabel(ticks) {
            if (ticks === 0) return '平盤';
            return `${ticks > 0 ? '+' : ''}${ticks} 檔`;
        }

        function App() {
            const [direction, setDirection] = useState('long');
            const [tradeMode, setTradeMode] = useState('marginLong'); // 預設提供融資
            const [productType, setProductType] = useState('stock');
            const [lots, setLots] = useState('10');
            const [entryPrice, setEntryPrice] = useState('');
            const [exitPrice, setExitPrice] = useState('');
            const [stopLoss, setStopLoss] = useState('');
            const [discount, setDiscount] = useState('0.18');
            const [minimumFee, setMinimumFee] = useState('20');
            const [targets, setTargets] = useState(DEFAULT_TARGETS);

            // 融資融券 State
            const [marginSelfRatio, setMarginSelfRatio] = useState(DEFAULT_MARGIN_SELF_RATIO); // 預設 40%
            const [marginInterestRate, setMarginInterestRate] = useState(DEFAULT_MARGIN_INTEREST_RATE); // 預設 4%
            const [marginDays, setMarginDays] = useState(DEFAULT_MARGIN_DAYS); // 預設 30 天

            const [shortMarginRatio, setShortMarginRatio] = useState(DEFAULT_SHORT_MARGIN_RATIO); // 預設 90%
            const [shortFeeRate, setShortFeeRate] = useState(DEFAULT_SHORT_FEE_RATE); // 預設 0.08%
            const [shortInterestRate, setShortInterestRate] = useState(DEFAULT_SHORT_INTEREST_RATE); // 預設 0.1%
            const [shortDays, setShortDays] = useState(DEFAULT_SHORT_DAYS); // 預設 30 天

            const [upwardLevels, setUpwardLevels] = useState(DEFAULT_LADDER_STEPS);
            const [downwardLevels, setDownwardLevels] = useState(DEFAULT_LADDER_STEPS);

            const handleModeSelect = (mode) => {
                setTradeMode(mode);
                if (mode === 'marginLong') {
                    setDirection('long');
                } else if (mode === 'marginShort') {
                    setDirection('short');
                }
            };

            const handleDirectionSelect = (dir) => {
                setDirection(dir);
                if (dir === 'long' && tradeMode === 'marginShort') {

                lots,

                stopLossInput: stopLoss,
                discountInput: discount,

                marginDaysInput: marginDays,

                lots,
                entryPrice,
                exitPrice,
                stopLoss,
                discount,
                minimumFee,
                targets,
                marginSelfRatio,
                marginInterestRate,
                marginDays,
                shortMarginRatio,
                shortFeeRate,
                shortInterestRate,
                shortDays,

                    entryPrice: results.entryPrice,
                    entry: results.entry,

                    shortInterestRate: results.shortInterestRate,
                    shortDays: results.shortDays,

                    downwardLevels,
                });

                                    <div className="grid grid-cols-2 gap-2 sm:grid-cols-4 lg:grid-cols-2">

                                            ['dayTrade', '現股當沖'],
                                            ['nonDayTrade', '現股非當沖'],

                                            ['marginShort', '融券賣出'],

                                                type="button"
                                                aria-pressed={tradeMode === value}

                                                    tradeMode === value
                                                        ? 'border-zinc-950 bg-zinc-950 text-white'
                                                        : 'border-zinc-300 bg-white text-zinc-700 hover:border-zinc-500'

                                            >
                                                {label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* 方向切換 */}

                                            ['short', isMarginShort ? '做空 (融券賣出)' : '做空 (先賣後買)'],

                                                aria-pressed={direction === value}

                                                    direction === value

                                                        : 'border-zinc-300 bg-white text-zinc-700 hover:border-zinc-500'

                                            >

                                            </button>

                                {/* 融資專屬參數 */}

                                        <div>

                                                className={`rounded-md border px-3 py-2 text-sm font-semibold transition ${

                                    <div className="mt-1.5 text-xs text-zinc-500">

                                    </div>
                                </div>

                                {/* 張數 */}
                                <div>
                                    <label className={labelClass} htmlFor="lots">張數</label>
                                    <div className="flex">
                                        <button
                                            type="button"
                                            onClick={() => handleLotsChange(-1)}
                                            className="w-11 rounded-l-md border border-zinc-300 bg-zinc-50 text-lg font-bold hover:bg-zinc-100"

                                        >
                                            -

                                        <input
                                            id="lots"
                                            type="number"
                                            min="1"
                                            step="1"
                                            inputMode="numeric"
                                            value={lots}
                                            onChange={(event) => setLots(event.target.value)}
                                            className="w-full border-y border-zinc-300 px-3 py-2 text-center text-base outline-none focus:ring-2 focus:ring-zinc-200"

                                            onClick={() => handleLotsChange(1)}

                                            +

                                    </div>
                                </div>

                                <div>
                                    <label className={labelClass} htmlFor="entryPrice">進場價格</label>
                                    <input
                                        id="entryPrice"
                                        type="number"
                                        min="0.01"
                                        step={results?.entryTick || 0.05}
                                        inputMode="decimal"
                                        value={entryPrice}
                                        onChange={(event) => setEntryPrice(event.target.value)}
                                        className={inputClass}
                                        placeholder="例如 100"

                                    <label className={labelClass} htmlFor="exitPrice">出場價格</label>

                                        type="number"
                                        min="0.01"

                                        inputMode="decimal"

                                        <input
                                            id="discount"
                                            type="number"
                                            min="0"
                                            max="1"
                                            step="0.01"
                                            inputMode="decimal"
                                            value={discount}
                                            onChange={(event) => setDiscount(event.target.value)}

                                            id="minimumFee"
                                            type="number"
                                            min="0"
                                            step="1"

                                            onChange={(event) => setMinimumFee(event.target.value)}
                                            className={inputClass}
                                        />
                                    </div>
                                </div>

                                <div className="grid grid-cols-4 gap-2">

                                <div>

                                    </label>
                                    <input
                                        id="targets"

                        {/* 右側試算結果 */}
                        <section className="rounded-lg border border-zinc-200 bg-white p-4 shadow-sm sm:p-5">

                                <div>
                                    <h2 className="text-lg font-bold">試算結果</h2>
                                    {results && (
                                        <p className="text-sm text-zinc-500">
                                            進場有效價 {formatPrice(results.entryPrice)}，升降單位 {formatPrice(results.entryTick)}

                                                    </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                    <p className="text-xs leading-5 text-zinc-500">
                                        升降單位依臺灣證券交易所集中市場規則估算；個股當沖證交稅千分之 1.5、個股一般與信用非當沖千分之 3、ETF 千分之 1。融資金額依規定採千元整數無條件捨去、融券保證金採百元整數進位。實際手續費、利息與交割金額仍以券商成交回報為準。
                                    </p>
                                </div>
                            )}
                        </section>
                    </div>
                </main>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
