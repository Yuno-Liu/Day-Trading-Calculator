    if (inputs.tradeDate) lines.push('交易日期 ' + inputs.tradeDate);
    return lines.join('\n');
  }
  const dirLabel = r.mode.directions.length > 1 ? '・' + r.mode.directionLabels[r.direction] : '';
  lines.push(r.mode.label + dirLabel + '｜' + r.product.label + '｜' + intText(r.lots) + ' 張 @ ' + priceText(r.entryPrice));
  const be = r.breakEven;
  lines.push(be.reachable ? '兩平價 ' + priceText(be.exitPrice) + '（' + ticksText(be.ticks) + '，' + pct(be.changeRate, true) + '）' : '兩平價：無法達成');
  if (r.manualExit) lines.push('出場 ' + priceText(r.manualExit.exitPrice) + '：淨損益 ' + smoney(r.manualExit.profit) + '，' + r.entry.returnRateLabel + ' ' + pct(r.manualExit.returnRate, true));
  if (r.stopLoss && r.stopLoss.reachable) lines.push('停損價 ' + priceText(r.stopLoss.exitPrice) + '（損益 ' + smoney(r.stopLoss.profit) + '）');
  if (r.entry.marginCallPrice != null) lines.push('追繳價 ' + priceText(r.entry.marginCallPrice) + '（進場維持率 ' + F.maintenance(r.entry.maintenance) + '）');
  lines.push('手續費 ' + r.fee.discountLabel + '・低消 ' + r.fee.minFee + '・' + r.fee.modelLabel + '；證交稅 ' + r.tax.label);
  lines.push('交易日期 ' + r.tradeDate + '；僅供試算參考，實際以券商成交回報為準');
  return lines.join('\n');
}

// ── 頁首 ─────────────────────────────────────────────────────────────
function Header({ scrolled, onShare, onReset, onAbout }) {
  const [menu, setMenu] = useState(false);
  const wrapRef = useRef(null);
  const btnRef = useRef(null);
  const menuRef = useRef(null);
  useEffect(() => {
    if (!menu) return undefined;
    const first = menuRef.current && menuRef.current.querySelector('[role="menuitem"]');
    if (first) first.focus();
    const onDoc = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setMenu(false); };
    const onKey = (e) => {
      if (e.key === 'Escape') { setMenu(false); if (btnRef.current) btnRef.current.focus(); }
    };
    document.addEventListener('pointerdown', onDoc);
    document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('pointerdown', onDoc); document.removeEventListener('keydown', onKey); };
  }, [menu]);
  const onMenuKey = (e) => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    const items = Array.prototype.slice.call(menuRef.current.querySelectorAll('[role="menuitem"]'));
    const i = items.indexOf(document.activeElement);
    const j = e.key === 'ArrowDown' ? (i + 1) % items.length : (i - 1 + items.length) % items.length;
    items[j].focus();
  };
  const pick = (fn) => { setMenu(false); fn(); };
  return (
    <header className={'app-header' + (scrolled ? ' is-scrolled' : '')}>
      <div className="bar gutter mx-auto max-w-[1280px]">
        <div className="bar-title" aria-hidden="true">台股當沖・融資融券計算機</div>
        <div className="relative flex items-center gap-2 ml-auto" ref={wrapRef}>
          <button type="button" className="icon-btn press" onClick={onShare} aria-label="分享試算結果">
            <Icon name="share" />
          </button>
          <button type="button" ref={btnRef} className="icon-btn press" aria-label="更多選項" aria-haspopup="menu"
            aria-expanded={menu} aria-controls="app-menu" onClick={() => setMenu((m) => !m)}>
            <Icon name="more" />
          </button>
          {menu ? (
            <div className="menu" id="app-menu" role="menu" aria-label="更多選項" ref={menuRef} onKeyDown={onMenuKey}>
              <button type="button" role="menuitem" className="menu-item" onClick={() => pick(onAbout)}>
                <Icon name="book" />說明與揭露
              </button>
              <button type="button" role="menuitem" className="menu-item is-danger" onClick={() => pick(onReset)}>
                <Icon name="reset" />重設為預設值…
              </button>
            </div>
          ) : null}
        </div>
      </div>
    </header>
  );
}

// ── 價格與數量卡 ───────────────────────────────────────────────────────
function PriceCard({ inputs, setField, result, msgs, onStepPrice, onStepLots }) {
  const pt = inputs.productType;
  const unit = T.PRODUCTS[pt].unit;
  const entryNum = T.parseNumber(inputs.entryPrice);
  const exitNum = T.parseNumber(inputs.exitPrice);
  const lotsNum = T.parseNumber(inputs.lots);
  const entryOk = entryNum != null && entryNum > 0;
  const tick = result.ok ? result.entryTick : entryOk ? T.getTickSize(entryNum, pt) : null;
  const exitTick = exitNum != null && exitNum > 0 ? T.getTickSize(exitNum, pt) : null;
  const r = result.ok ? result : null;
  const mx = r && r.manualExit;
  const sl = r && r.stopLoss;
  const exitBase = (exitNum != null && exitNum > 0) || entryOk;
  return (
    <section className="card card-pad" aria-labelledby="sec-price">
      <h2 id="sec-price" className="headline mb-3">價格與數量</h2>
      <StepField id="f-entry" label="進場價" big value={inputs.entryPrice} placeholder="例如 100"
        aside={tick ? '升降單位 ' + tick + ' 元' : '依價位自動對齊檔位'}
        onChange={(v) => setField('entryPrice', v)} onStep={(d) => onStepPrice('entryPrice', d)}
        canDown={entryOk && entryNum > 0.01} canUp={entryOk} downLabel="進場價減 1 檔" upLabel="進場價加 1 檔"
        msgs={msgs.entryPrice} onEnter={() => focusNext('f-entry')}
        after={r ? (
          <p className="inline-result" id="entry-result">
            <Parts parts={[
              r.breakEven.reachable
                ? <React.Fragment>兩平價 <b><PriceTag value={r.breakEven.exitPrice} base={r.entryPrice} /></b>（{ticksText(r.breakEven.ticks)}）</React.Fragment>
                : <React.Fragment>兩平價 <b className="c-warn">無法達成</b></React.Fragment>,
              r.breakEven.reachable && r.breakEven.beyondLimit ? <BeyondFlag price={r.breakEven.exitPrice} limits={r.limits} /> : null,
              r.entry.marginCallPrice != null
                ? <React.Fragment>追繳價 <b><PriceTag value={r.entry.marginCallPrice} base={r.entryPrice} /></b></React.Fragment> : null,
            ]} />
          </p>
        ) : null} />
      <StepField id="f-lots" label="張數" value={inputs.lots} inputMode="numeric" placeholder="1"
        aside={lotsNum != null && lotsNum >= 1 ? '共 ' + intText(Math.round(lotsNum) * 1000) + ' ' + unit : '1 張 = 1,000 ' + unit}
        onChange={(v) => setField('lots', v)} onStep={onStepLots}
        canDown={lotsNum != null && lotsNum > 1} canUp={lotsNum == null || lotsNum < 100000}
        downLabel="減少 1 張" upLabel="增加 1 張" msgs={msgs.lots} onEnter={() => focusNext('f-lots')} />
      <StepField id="f-exit" label="出場價（選填）" value={inputs.exitPrice} placeholder="試算自訂出場"
        aside={!isBlank(inputs.exitPrice) ? (
          <button type="button" className="btn btn-plain btn-sm press -my-2.5 -mr-2" onClick={(e) => { setField('exitPrice', ''); keepFocus(e, 'f-exit'); }}>清除</button>
        ) : (exitTick ? '升降單位 ' + exitTick + ' 元' : '空白時 ± 以進場價起算')}
        onChange={(v) => setField('exitPrice', v)} onStep={(d) => onStepPrice('exitPrice', d)}
        canDown={exitBase} canUp={exitBase} downLabel="出場價減 1 檔" upLabel="出場價加 1 檔"
        msgs={msgs.exitPrice} onEnter={() => focusNext('f-exit')}
        after={mx ? (
          <p className="inline-result" id="exit-result">
            <Parts parts={[
              <React.Fragment>淨損益 <b className={signCls(mx.profit)}>{smoney(mx.profit)}</b></React.Fragment>,
              <React.Fragment>{r.entry.returnRateLabel} <b className={signCls(mx.profit)}>{pct(mx.returnRate, true)}</b></React.Fragment>,
              mx.maintenance != null
                ? <React.Fragment>維持率 <b className={mx.belowCall ? 'c-danger' : ''}>{F.maintenance(mx.maintenance)}</b></React.Fragment> : null,
            ]} />
          </p>
        ) : null} />
      <TextField id="f-stop" label="停損金額（選填）" value={inputs.stopLoss} inputMode="numeric" suffix="元"
        placeholder="例如 5000" onChange={(v) => setField('stopLoss', v)} msgs={msgs.stopLoss}
        aside="可承受的最大淨虧損"
        after={sl && sl.reachable ? (
          <p className="inline-result" id="stop-result">
            <Parts parts={[
              <React.Fragment>停損價 <b><PriceTag value={sl.exitPrice} base={r.entryPrice} /></b>（{ticksText(sl.ticks)}）</React.Fragment>,
              sl.beyondLimit ? <BeyondFlag price={sl.exitPrice} limits={r.limits} /> : null,
              <React.Fragment>損益 <b className={signCls(sl.profit)}>{smoney(sl.profit)}</b></React.Fragment>,
            ]} />
          </p>
        ) : null} />
    </section>
  );
}

// ── 費用設定 ─────────────────────────────────────────────────────────
function FeeSection({ inputs, setField, result, msgs, open, onToggle }) {
  const d = T.parseDiscount(inputs.discount);
  const modelLabel = RULES.commission.models[inputs.feeModel] ? RULES.commission.models[inputs.feeModel].label : '即時折讓';
  const minFeeText = result.ok ? String(result.fee.minFee) : (isBlank(inputs.minFee) ? String(RULES.commission.defaultMinFee) : inputs.minFee);
  const eff = result.ok ? result.fee.effectiveRate : RULES.commission.baseRate * d.value;
  const n = countWarn(msgs, SECTION_FIELDS.fees);
  return (
    <Disclosure id="fees" title="費用設定" open={open} onToggle={onToggle}
      summary={d.label + '・低消 ' + minFeeText + '・' + modelLabel}
      badge={n ? <span className="badge badge-warn"><Icon name="warn" size={12} />{n}</span> : null}>
      <TextField id="f-discount" label="手續費折數" value={inputs.discount} placeholder="0.18 或 1.8"
        aside={'有效費率 ' + ratio(eff)} onChange={(v) => setField('discount', v)} msgs={msgs.discount}
        hint={'0.1425% × 折數。輸入 0.18 或 1.8（折）皆可，無折扣填 1。'}>
        <Chips label="折數快選" options={RULES.commission.discountPresets}
          isSelected={(v) => !d.invalid && Math.abs(d.value - v) < 1e-9} onPick={(v) => setField('discount', String(v))} />
      </TextField>
      <TextField id="f-minfee" label="最低手續費" value={inputs.minFee} inputMode="numeric" suffix="元"
        placeholder={String(RULES.commission.defaultMinFee)} onChange={(v) => setField('minFee', v)} msgs={msgs.minFee}
        hint="每筆成交的手續費下限（元以下捨去後比較）。" />
      <div className="field">
        <p id="lbl-feemodel" className="field-label mb-2">折讓方式</p>
        <Segmented idBase="feemodel" labelledBy="lbl-feemodel" value={inputs.feeModel}
          options={['instant', 'monthly'].map((k) => ({ value: k, label: RULES.commission.models[k].label }))}
          onChange={(v) => setField('feeModel', v)} />
        <p className="field-hint">{RULES.commission.models[inputs.feeModel === 'monthly' ? 'monthly' : 'instant'].formula}</p>
      </div>
    </Disclosure>
  );
}

// ── 信用參數 ─────────────────────────────────────────────────────────
function PresetField({ id, label, value, onChange, msgs, presets, suffix, aside, hint, placeholder, inputMode, chipLabel, fmt }) {
  const cur = T.parseNumber(value);
  return (
    <TextField id={id} label={label} value={value} onChange={onChange} msgs={msgs} suffix={suffix} aside={aside}
      hint={hint} placeholder={placeholder} inputMode={inputMode}>
      <Chips label={chipLabel || label + '快選'} options={presets.map((p) => ({ value: p, label: fmt ? fmt(p) : p + (suffix || '') }))}
        isSelected={(v) => cur != null && Math.abs(cur - v) < 1e-9} onPick={(v) => onChange(String(v))} />
    </TextField>
  );
}

// 「融券手續費」（0.08%）與券源為借入券／自有券時的「融券費」是兩種費用
const SHORT_FEE_SOURCE_NOTE = '券源為借入券或自有券時，券商改收『融券費』（年利率上限 16%，雙方議定），本計算機未計入。';

function CreditSection({ inputs, setField, result, msgs, open, onToggle, today }) {
  const m = inputs.tradeMode;
  const tradeDate = isBlank(inputs.tradeDate) ? today : inputs.tradeDate;
  const minShort = T.getMinShortMarginRatio(tradeDate);
  const minPct = Math.round(minShort.ratio * 100);
  const floorPct = Math.round(RULES.shortSelling.floorRatio * 100); // 常態法定最低 90%
  const periods = RULES.shortSelling.marginPeriods;
  const nextPeriod = minShort.to ? periods.find((p) => p.from && p.from > minShort.to) : null;
  const daysFmt = (v) => (v === 0 ? '0 天' : v + ' 天');
  const n = countWarn(msgs, SECTION_FIELDS.credit);
  let summary = '';
  // 有結果時顯示引擎清洗後實際採用的值（例如自備 30% 會顯示為 40%）
  const c = result.ok && result.credit ? result.credit : null;
  if (m === 'marginLong') {
    summary = c ? '自備 ' + ratio(c.selfRatio) + '・年利率 ' + ratio(c.interestRate) + '・' + c.days + ' 天'
      : '自備 ' + (inputs.marginSelfRatio || '40') + '%・年利率 ' + (inputs.marginInterestRate || '6.45') + '%・' + (inputs.marginDays || '30') + ' 天';
  } else if (m === 'marginShort') {
    summary = c ? '保證金 ' + (c.marginRatioAuto ? '自動 ' : '') + ratio(c.marginRatio) + '・融券手續費 ' + ratio(c.feeRate) + '・' + c.days + ' 天'
      : '保證金 ' + (isBlank(inputs.shortMarginRatio) ? '自動 ' + minPct + '%' : inputs.shortMarginRatio + '%') + '・融券手續費 ' + (inputs.shortFeeRate || '0.08') + '%・' + (inputs.shortDays || '30') + ' 天';
  } else {
    summary = '融券手續費 ' + (c ? ratio(c.feeRate) : (inputs.shortFeeRate || '0.08') + '%') + '・不計息';
  }
  const selfNum = T.parseNumber(inputs.marginSelfRatio);
  return (
    <Disclosure id="credit" title="信用參數" open={open} onToggle={onToggle} summary={summary}
      badge={n ? <span className="badge badge-warn"><Icon name="warn" size={12} />{n}</span> : null}>
      {m === 'marginLong' ? (
        <div>
          <PresetField id="f-mself" label="自備款成數" value={inputs.marginSelfRatio} onChange={(v) => setField('marginSelfRatio', v)}
            msgs={msgs.marginSelfRatio} presets={RULES.margin.selfRatioPresets} suffix="%"
            aside={selfNum != null ? '融資 ' + Math.max(0, Math.round((100 - Math.min(100, Math.max(40, selfNum))) * 100) / 100) + '%' : null}
            hint="法定最高融資 6 成（自備至少 4 成）；個股可能被調降，可輸入更高的自備成數。" placeholder="40" />
          <PresetField id="f-mrate" label="融資年利率" value={inputs.marginInterestRate} onChange={(v) => setField('marginInterestRate', v)}
            msgs={msgs.marginInterestRate} presets={RULES.margin.interestRatePresets} suffix="%" placeholder="6.45"
            hint={RULES.margin.interestFormula} />
          <PresetField id="f-mdays" label="融資天數" value={inputs.marginDays} onChange={(v) => setField('marginDays', v)}
            msgs={msgs.marginDays} presets={RULES.daysPresets} suffix="天" fmt={daysFmt} inputMode="numeric" placeholder="30"
            hint={RULES.margin.daysNote} chipLabel="天數快選" />
        </div>
      ) : null}
      {m === 'marginShort' ? (
        <div>
          <TextField id="f-sratio" label="融券保證金成數" value={inputs.shortMarginRatio} suffix="%"
            placeholder={'自動：現行最低 ' + minPct + '%'} onChange={(v) => setField('shortMarginRatio', v)} msgs={msgs.shortMarginRatio}
            aside={!isBlank(inputs.shortMarginRatio) ? (
              <button type="button" className="btn btn-plain btn-sm press -my-2.5 -mr-2" onClick={(e) => { setField('shortMarginRatio', ''); keepFocus(e, 'f-sratio'); }}>改回自動</button>
            ) : '空白＝依交易日期'}
            hint={minShort.note + (nextPeriod ? '；' + nextPeriod.note : '') + '。'
              + (minPct > floorPct ? '臨時措施；若金管會已解除，可直接輸入 ' + floorPct + '。' : '可輸入更高成數。')} />
          <PresetField id="f-sfee" label="融券手續費率" value={inputs.shortFeeRate} onChange={(v) => setField('shortFeeRate', v)}
            msgs={msgs.shortFeeRate} presets={RULES.shortSelling.feeRatePresets} suffix="%" placeholder="0.08"
            hint={'融券賣出時自價款扣除；' + RULES.shortSelling.feeRounding + '。' + SHORT_FEE_SOURCE_NOTE} />
          <PresetField id="f-srate" label="擔保品年利率" value={inputs.shortInterestRate} onChange={(v) => setField('shortInterestRate', v)}
            msgs={msgs.shortInterestRate} presets={RULES.shortSelling.interestRatePresets} suffix="%" placeholder="0.2"
            hint={RULES.shortSelling.interestFormula} />
          <PresetField id="f-sdays" label="融券天數" value={inputs.shortDays} onChange={(v) => setField('shortDays', v)}
            msgs={msgs.shortDays} presets={RULES.daysPresets} suffix="天" fmt={daysFmt} inputMode="numeric" placeholder="30"
            chipLabel="天數快選" hint="計息天數＝回補交割日 − 賣出交割日（日曆日）。" />
        </div>
      ) : null}
      {m === 'creditDayTrade' ? (
        <PresetField id="f-sfee" label="融券手續費率" value={inputs.shortFeeRate} onChange={(v) => setField('shortFeeRate', v)}
          msgs={msgs.shortFeeRate} presets={RULES.shortSelling.feeRatePresets} suffix="%" placeholder="0.08"
          hint={'資券當沖同日相抵不計息；融券賣出那一邊收融券手續費。' + SHORT_FEE_SOURCE_NOTE} />
      ) : null}
    </Disclosure>
  );
}

      </div>
      <TextField id="f-taxov" label="證交稅率覆寫" value={inputs.taxRateOverride} suffix="%" placeholder="例：REITs 0、TDR 0.1"
        onChange={(v) => setField('taxRateOverride', v)} msgs={msgs.taxRateOverride}
        hint={RULES.tax.overrideNote + '；空白＝依商品、模式與日期自動判斷。'} />
      <TextField id="f-targets" label="目標淨利率" value={inputs.targets} inputMode="text" placeholder={DEFAULTS.targets} maxLength={120}
        onChange={(v) => setField('targets', v)} msgs={msgs.targets}
        hint={'單位 %，以逗號分隔，最多 ' + RULES.maxTargets + ' 項；依「' + capLabel + '」計算。'} />
    </Disclosure>
  );
}

// ── 結果：摘要 ─────────────────────────────────────────────────────────
let firstResultMarked = false;
function SummaryCard({ r, cardRef }) {
  useLayoutEffect(() => {
    if (!firstResultMarked) {
      firstResultMarked = true;
      try { performance.mark('tw:first-result'); } catch (e) { /* 忽略 */ }
    }
  }, []);
  const e = r.entry;
  const be = r.breakEven;
  const mx = r.manualExit;
  const sl = r.stopLoss;
  const dirLabel = r.mode.directions.length > 1 ? '・' + r.mode.directionLabels[r.direction] : '';
  const isMarginMode = r.tradeMode === 'marginLong' || r.tradeMode === 'marginShort';
  const tiles = [];
  const primary = (
    <Tile primary label="損益兩平價"
      value={be.reachable ? <PriceTag value={be.exitPrice} base={r.entryPrice} /> : <span className="c-warn">無法達成</span>}
      flag={be.reachable && be.beyondLimit ? <BeyondFlag price={be.exitPrice} limits={r.limits} /> : null}
      sub={be.reachable
        ? [breakEvenMove(be.ticks), pct(be.changeRate, true), '理論價 ' + priceText(be.theoreticalPrice)]
        : '費用高於此方向的可能獲利'} />
  );
  if (mx) {
    tiles.push(<Tile key="pl" label="淨損益"
      value={<span className={signCls(mx.profit)}>{smoney(mx.profit)}</span>}
      sub={['出場 ' + priceText(mx.exitPrice), e.returnRateLabel + ' ' + pct(mx.returnRate, true)]} />);
  } else {
    const parts = ['手續費＋證交稅'];
    if (e.shortFee > 0 || be.exitShortFee > 0) parts.push('＋融券手續費');
    if (e.interestType === 'cost') parts.push('＋融資利息');
    if (e.interestType === 'income') parts.push('−利息收入');
    tiles.push(<Tile key="cost" label="兩平來回成本" value={money(be.totalCosts)} sub={parts} sep="" />);
  }
  if (isMarginMode) {
    if (e.marginCallPrice != null) {
      tiles.push(<Tile key="call" label="追繳價"
        value={<PriceTag value={e.marginCallPrice} base={r.entryPrice} />}
        sub={[pct((e.marginCallPrice - r.entryPrice) / r.entryPrice, true), e.marginCallDirection === 'below' ? '收盤低於此價即追繳' : '收盤高於此價即追繳']} />);
    } else {
      tiles.push(<Tile key="call" label="追繳價" value="無" sub={['未動用融資', '不會追繳']} />);
    }
    const mt = mx && mx.maintenance != null ? mx.maintenance : e.maintenance;
    if (mt != null) {
      const below = !!(mx && mx.belowCall);
      tiles.push(<Tile key="mt" label={mx ? '出場維持率' : '進場維持率'}
        value={<span className={below ? 'c-danger' : ''}>{below ? <Icon name="warn" size={20} className="inline-block align-[-2px] mr-1" /> : null}{F.maintenance(mt)}</span>}
        sub={below ? ['低於 130%', '將被追繳'] : ['追繳門檻 130%', '回到 166% 解除']} />);
    }
  }
  if (sl) {
    tiles.push(<Tile key="sl" label="停損價"
      value={sl.reachable ? <PriceTag value={sl.exitPrice} base={r.entryPrice} /> : <span className="c-warn">無對應價</span>}
      flag={sl.reachable && sl.beyondLimit ? <BeyondFlag price={sl.exitPrice} limits={r.limits} /> : null}
      sub={sl.reachable ? [ticksText(sl.ticks), '損益 ' + smoney(sl.profit), '停損 ' + money(sl.stopLossAmount) + ' 元'] : ['停損 ' + money(sl.stopLossAmount) + ' 元', '超過最大可能虧損']} />);
  }
  return (
    <div className="card card-pad" id="result-summary" ref={cardRef}>
      <p className="sum-head">
        {r.mode.label + dirLabel}・{r.product.label}・{intText(r.lots)} 張 @ {priceText(r.entryPrice)}
        {r.entryPriceAdjusted ? <span className="badge badge-warn ml-2">已對齊檔位</span> : null}
      </p>
      {primary}
      <div className="tiles mt-2.5">{tiles}</div>
    </div>
  );
}

// 依日期而變的稅率提示：即使是 info、欄位在預設收合的進階區，也要在結果區顯示
const DATE_NOTE_CODES = { TAX_CUT_BOUNDARY: 1, BOND_ETF_EXEMPTION_BOUNDARY: 1, TAX_RULE_CHANGES_BEFORE_EXIT: 1, BOND_ETF_EXEMPTION_EXPIRING: 1 };
function NotesBlock({ r }) {
  const list = (r.warnings || []).filter((w) => DATE_NOTE_CODES[w.code] || (w.field ? (w.level === 'warn' && !INLINE_FIELDS[w.field]) : true));
  if (!list.length) return null;
  return (
    <div className="notes" role="list" aria-label="提醒">
      {list.map((w, i) => (
        <p key={w.code + i} role="listitem" className={'note ' + (w.level === 'warn' ? 'note-warn' : 'note-info')}>
          <Icon name={w.level === 'warn' ? 'warn' : 'info'} size={16} />
          <span className="min-w-0">{w.message}</span>
        </p>
      ))}
    </div>
  );
}

// ── 結果：明細 ─────────────────────────────────────────────────────────
function commissionRow(label, c, model) {
  if (model === 'monthly') {
    return { label, value: money(c.charged), sub: '次月退 ' + money(c.refund) + '・實付 ' + money(c.net) };
  }
  return { label, value: money(c.charged) };
}

function EntryCard({ r }) {
  const e = r.entry;
  const act = r.mode.actions[r.direction];
  const ML = r.tradeMode === 'marginLong';
  const MS = r.tradeMode === 'marginShort';
  const rows = [
    { label: act.entry + '成交金額', value: money(e.gross) },
    ML ? { label: '融資金額（' + ratio(r.credit.loanRatio) + '）', value: money(e.loan), sub: '千元以下捨去' } : null,
    ML ? { label: '自備款（' + ratio(r.credit.selfRatio) + '）', value: money(e.selfFunds) } : null,
    MS ? { label: '融券保證金（' + ratio(r.credit.marginRatio) + (r.credit.marginRatioAuto ? '・自動' : '') + '）', value: money(e.collateral), sub: '百元以下進位' } : null,
    commissionRow('手續費', e.commission, r.fee.model),
    e.tax > 0 ? { label: '證交稅（' + ratio(r.tax.rate) + '）', value: money(e.tax) } : null,
    e.shortFee > 0 ? { label: '融券手續費（' + ratio(r.credit.feeRate) + '）', value: money(e.shortFee) } : null,
    MS ? { label: '融券擔保價款', value: money(e.guaranty), sub: '賣出價款扣費稅後由券商保管' } : null,
    e.cashOut > 0
      ? { label: MS ? '進場應付（僅保證金）' : '進場應付', value: money(e.cashOut), strong: true, total: true }
      : { label: '進場實收', value: money(e.cashIn), strong: true, total: true },
    { label: '報酬率分母', value: money(e.capitalBase), sub: e.capitalBaseLabel },
    ML ? (e.loan > 0
      ? { label: '進場維持率', value: F.maintenance(e.maintenance) }
      : { label: '進場維持率', value: '未動用融資' }) : null,
    MS ? { label: '進場維持率', value: F.maintenance(e.maintenance) } : null,
  ];
  return (
    <section className="card card-pad" aria-labelledby="sec-entry">
      <div className="card-title">
        <h3 id="sec-entry" className="headline">進場明細</h3>
        <span className="badge badge-gray">{act.entry} {priceText(r.entryPrice)}</span>
      </div>
      <DL rows={rows} />
    </section>
  );
}

function ExitCard({ r }) {
  const e = r.entry;
  const t = r.manualExit || r.breakEven;
  const isManual = !!r.manualExit;
  const act = r.mode.actions[r.direction];
  const ML = r.tradeMode === 'marginLong';
  const MS = r.tradeMode === 'marginShort';
  const sameDay = r.mode.sameDay;
  const amt = t.settlement.amount;
  let settleSub = null;
  let settleTone = '';
  if (sameDay) settleSub = amt >= 0 ? '應收' : '應付';
  else if (amt < 0) { settleSub = '需補繳'; settleTone = 'c-danger'; }
  const rows = [
    MS ? { label: '退還保證金＋擔保價款', value: money(e.collateral + e.guaranty) } : null,
    { label: act.exit + '成交金額', value: money(t.exitGross) },
    ML ? { label: '償還融資', value: money(e.loan) } : null,
    ML ? { label: '融資利息（' + e.days + ' 天・' + ratio(r.credit.interestRate) + '）', value: money(t.interest) } : null,
    MS ? { label: '融券利息收入（' + e.days + ' 天・' + ratio(r.credit.interestRate) + '）', value: '+' + money(t.interest) } : null,
    commissionRow('手續費', t.exitCommission, r.fee.model),
    t.exitTax > 0 ? { label: '證交稅（' + ratio(r.tax.rate) + '）', value: money(t.exitTax) } : null,
    t.exitShortFee > 0 ? { label: '融券手續費（' + ratio(r.credit.feeRate) + '）', value: money(t.exitShortFee) } : null,
    sameDay ? (e.cashOut > 0
      ? { label: '與進場相抵（進場應付）', value: money(e.cashOut) }
      : { label: '與進場相抵（進場實收）', value: money(e.cashIn) }) : null,
    {
      label: t.settlement.label, value: amt < 0 && !sameDay ? <span><Icon name="warn" size={16} className="inline-block align-[-2px] mr-1" />{smoney(amt)}</span> : smoney(amt),
      sub: settleSub, tone: settleTone, strong: true, total: true,
    },
    { label: '來回總成本', value: money(t.totalCosts), sub: '手續費＋稅' + (t.interestType === 'cost' ? '＋利息' : t.interestType === 'income' ? '−利息收入' : '') + (e.shortFee > 0 || t.exitShortFee > 0 ? '＋融券手續費' : '') },
    { label: '淨損益', value: smoney(t.profit), tone: signCls(t.profit), strong: true },
    { label: e.returnRateLabel, value: pct(t.returnRate, true), tone: signCls(t.profit), sub: '淨損益 ÷ ' + e.capitalBaseLabel },
    { label: '價差報酬率', labelSub: '依方向計算的價格變動，不含費用與槓桿', value: pct(t.nominalReturnRate, true), tone: signCls(t.nominalReturnRate) },
    t.maintenance != null ? {
      label: '出場維持率',
      value: t.belowCall ? <span><Icon name="warn" size={16} className="inline-block align-[-2px] mr-1" />{F.maintenance(t.maintenance)}</span> : F.maintenance(t.maintenance),
      tone: t.belowCall ? 'c-danger' : '', sub: t.belowCall ? '低於 130%：將被追繳' : '高於 130% 追繳門檻',
    } : null,
    r.fee.model === 'monthly' ? { label: '月退制退款', value: money(e.commission.refund + t.exitCommission.refund), sub: '交割依原價收取，次月退還；損益已扣除退款' } : null,
  ];
  return (
    <section className="card card-pad" aria-labelledby="sec-exit">
      <div className="card-title">
        <h3 id="sec-exit" className="headline">出場明細</h3>
        <span className={'badge ' + (isManual ? 'badge-accent' : 'badge-gray')}>
          {isManual ? '自訂 ' + priceText(t.exitPrice) : '兩平價 ' + priceText(t.exitPrice) + '（參考）'}
        </span>
      </div>
      <DL rows={rows} />
    </section>
  );
}

// 融券最低成數：若目前期間有結束日，附上下一期的說明（例：2026/11/09 起 130%）
function nextShortNote(tradeDate) {
  const cur = T.getMinShortMarginRatio(tradeDate);
  if (!cur || !cur.to) return '';
  const next = RULES.shortSelling.marginPeriods.find((p) => p.from && p.from > cur.to);
  return next ? '；' + next.note : '';
}

function ConditionsCard({ r, today }) {
  // 融資的證交稅依出場日（交易日期＋融資天數）判斷；判斷日不是交易日期時明確標示。
  // 只有債券ETF 的稅率會隨日期改變（停徵期間），個股／ETF 信用交易稅率固定，不顯示以免干擾。
  const exitBasis = r.tax.basis === 'exit' && r.tax.date && r.tax.date !== r.tradeDate && !r.tax.overridden && r.productType === 'bondEtf';
  const rows = [
    { label: '有效手續費率', value: ratio(r.fee.effectiveRate), sub: ratio(r.fee.baseRate) + ' × ' + r.fee.discountLabel + '・' + r.fee.modelLabel + '・低消 ' + r.fee.minFee + ' 元' },
    { label: '證交稅', value: r.tax.label, sub: (r.tax.note || '') + (r.tax.rounding === 'round' ? '；尾數四捨五入' : '；尾數無條件捨去') },
    exitBasis ? { label: '稅率判斷日', value: r.tax.date, sub: '證交稅依出場日 ' + r.tax.date + ' 判斷（交易日期＋融資 ' + r.credit.days + ' 天）' } : null,
    r.tradeMode === 'marginLong' ? { label: '融資條件', value: '年利率 ' + ratio(r.credit.interestRate) + '・' + r.credit.days + ' 天', sub: '自備 ' + ratio(r.credit.selfRatio) + '・融資 ' + ratio(r.credit.loanRatio) } : null,
    r.tradeMode === 'marginShort' ? { label: '融券條件', value: '保證金 ' + ratio(r.credit.marginRatio) + '・' + r.credit.days + ' 天', sub: '融券手續費 ' + ratio(r.credit.feeRate) + '・擔保品年利率 ' + ratio(r.credit.interestRate) } : null,
    r.tradeMode === 'creditDayTrade' ? { label: '融券手續費率', value: ratio(r.credit.feeRate), sub: '同日相抵不計息' } : null,
    { label: '總股數', value: intText(r.shares) + ' ' + r.product.unit, sub: intText(r.lots) + ' 張' },
    { label: '交易日期', value: r.tradeDate + (r.tradeDate === today ? '（今日）' : '') },
    r.limits ? { label: '漲停／跌停', value: priceText(r.limits.limitUp) + '／' + priceText(r.limits.limitDown), sub: '參考價 ' + priceText(r.limits.refPrice) + '・幅度 ' + ratio(r.limits.limitPct) } : null,
    r.shortMarginMin ? { label: '融券最低成數', value: ratio(r.shortMarginMin.ratio), sub: r.shortMarginMin.note + nextShortNote(r.tradeDate) } : null,
  ];
  return (
    <section className="card card-pad" aria-labelledby="sec-cond">
      <div className="card-title"><h3 id="sec-cond" className="headline">費率與條件</h3></div>
      <DL rows={rows} />
      <ul className="mt-3 space-y-1">
        {r.mode.notes.map((n) => <li key={n} className="footnote">・{n}</li>)}
      </ul>
    </section>
  );
}

// ── 結果：目標價 ───────────────────────────────────────────────────────

  return (
    <section className="card card-pad" aria-labelledby="sec-targets">

        <div className="min-w-0">
          <h3 id="sec-targets" className="headline">目標價</h3>
          <p className="footnote mt-1"><Parts parts={['依「' + r.entry.capitalBaseLabel + '」計算的淨利率', '點列查看細節']} sep="，" /></p>
        </div>
        <button type="button" className="btn btn-plain btn-sm press -mr-2 shrink-0" onClick={onEditTargets}>編輯目標</button>

                    {t.reachable ? <PriceTag value={t.exitPrice} base={r.entryPrice} /> : <span className="c-warn">無法達成</span>}

                  </span>

                      <div><dt>理論價</dt><dd>{priceText(t.theoreticalPrice)}</dd></div>
                      <div><dt>實際淨利率</dt><dd className={signCls(t.profit)}>{pct(t.returnRate, true)}</dd></div>

// ── 結果：價格階梯 ─────────────────────────────────────────────────────
function LadderRow({ row, entryPrice, credit, isCurrent, onApply }) {
  const tags = [];
  const said = [];
  if (row.isEntry) { tags.push(<span key="e" className="badge badge-hl">進場</span>); said.push('進場價'); }
  if (row.isBreakEven) { tags.push(<span key="b" className="badge badge-accent">兩平</span>); said.push('兩平'); }
  if (row.isMarginCall) { tags.push(<span key="m" className="badge badge-danger">追繳</span>); said.push('追繳價'); }
  if (row.isLimitUp) { tags.push(<span key="u" className="badge badge-gray">漲停</span>); said.push('漲停'); }
  if (row.isLimitDown) { tags.push(<span key="d" className="badge badge-gray">跌停</span>); said.push('跌停'); }
  if (row.beyondLimit) { tags.push(<span key="x" className="badge badge-gray">超出漲跌停</span>); said.push('超出漲跌停'); }
  if (isCurrent) { tags.push(<span key="c" className="badge badge-accent">目前出場</span>); said.push('目前出場價'); }
  const cls = 'lad-row row-press' + (row.isEntry ? ' is-entry' : '') + (row.beyondLimit ? ' is-beyond' : '') + (isCurrent ? ' is-current' : '');
  const aria = '帶入出場價 ' + priceText(row.exitPrice) + '，' + ticksText(row.ticks) + '，損益 ' + smoney(row.profit) + (said.length ? '（' + said.join('、') + '）' : '');
  return (
    <li>
      <button type="button" className={cls} onClick={() => onApply(row.exitPrice)} aria-label={aria} aria-current={isCurrent ? 'true' : undefined}>
        <Haptic />
        <span className="lad-c1">
          <span className="lad-price"><PriceTag value={row.exitPrice} base={entryPrice} />{tags}</span>
          <span className="lad-meta">{ticksText(row.ticks)}・{pct(row.changeRate, true)}</span>
        </span>
        <span className="lad-cm">
          <span className="lad-sm">{money(row.totalCosts)}</span>
          {credit ? <span className={'lad-sm' + (row.belowCall ? ' c-danger' : '')}>{row.belowCall ? <Icon name="warn" size={13} className="inline-block align-[-1px] mr-0.5" /> : null}{F.maintenance(row.maintenance)}</span> : null}
        </span>
        <span className="lad-c2">
          <span className={'lad-pl ' + signCls(row.profit)}>{smoney(row.profit)}</span>
          <span className={'lad-meta ' + signCls(row.profit)}>{pct(row.returnRate, true)}</span>
        </span>
        <span className="lad-cols">
          <span>{ticksText(row.ticks)}</span>
          <span className={signCls(row.changeRate)}>{pct(row.changeRate, true)}</span>
          <span>{money(row.totalCosts)}</span>
          <span className={signCls(row.profit) + ' font-semibold'}>{smoney(row.profit)}</span>
          <span className={signCls(row.profit)}>{pct(row.returnRate, true)}</span>
          {credit ? <span className={row.belowCall ? 'c-danger font-semibold' : ''}>{row.belowCall ? <Icon name="warn" size={14} className="inline-block align-[-2px] mr-1" /> : null}{F.maintenance(row.maintenance)}</span> : null}
        </span>
      </button>
    </li>
  );
}

function LadderCard({ r, ext, setExt, onApplyExit }) {
  const rows = useMemo(() => T.buildLadder(r, ext).rows, [r, ext]);
  const credit = r.entry.maintenance != null;
  const cur = r.manualExit ? r.manualExit.exitPrice : null;
  const isDefault = ext.up === LADDER_DEFAULT && ext.down === LADDER_DEFAULT;
  const lowest = rows.length ? rows[rows.length - 1].exitPrice : null;
  return (
    <section className={'card card-pad' + (credit ? ' lad-credit' : '')} aria-labelledby="sec-ladder">
      <div className="card-title">
        <div className="min-w-0">
          <h3 id="sec-ladder" className="headline">價格階梯</h3>
          <p className="footnote mt-1"><Parts parts={['以進場價為中心', '點任一列帶入出場價']} sep="，" /></p>
        </div>
        {!isDefault ? <button type="button" className="btn btn-gray btn-sm press shrink-0" onClick={(e) => { setExt({ up: LADDER_DEFAULT, down: LADDER_DEFAULT }); keepFocus(e, 'lad-up'); }}>重設</button> : null}
      </div>
      <div className="ladder-more">
        <button type="button" id="lad-up" className="btn btn-gray btn-sm press" onClick={() => setExt({ up: ext.up + LADDER_STEP, down: ext.down })}>
          <Icon name="plus" size={16} />向上 +{LADDER_STEP} 檔
        </button>
      </div>
      <div className="lad-head-m" aria-hidden="true">
        <span>價格・檔數・漲跌</span><span>{credit ? '成本／維持率' : '總成本'}</span><span>損益／{r.entry.returnRateLabel}</span>
      </div>
      <div className="lad-head" aria-hidden="true">
        <span>價格</span><span>檔數</span><span>漲跌</span><span>總成本</span><span>損益</span><span>{r.entry.returnRateLabel}</span>{credit ? <span>維持率</span> : null}
      </div>
      <ul className="list" aria-label="價格階梯（由高到低）">
        {rows.map((row) => (
          <LadderRow key={row.exitPrice} row={row} entryPrice={r.entryPrice} credit={credit}
            isCurrent={cur != null && row.exitPrice === cur} onApply={onApplyExit} />
        ))}
      </ul>
      <div className="ladder-more">
        <button type="button" className="btn btn-gray btn-sm press" disabled={lowest != null && lowest <= 0.01}
          onClick={() => setExt({ up: ext.up, down: ext.down + LADDER_STEP })}>
          <Icon name="plus" size={16} />向下 +{LADDER_STEP} 檔
        </button>
      </div>
    </section>
  );
}

function SummaryBar({ r, onJump }) {

  if (mx) {
    items.push({ k: 'pl', label: '淨損益', node: <span className={signCls(mx.profit)}>{smoney(mx.profit)}</span> });
    items.push({ k: 'rr', label: e.returnRateLabel, node: <span className={signCls(mx.profit)}>{pct(mx.returnRate, true)}</span> });

    items.push({ k: 'call', label: '追繳價', node: <PriceTag value={e.marginCallPrice} base={r.entryPrice} /> });

    items.push({ k: 'tk', label: '兩平需', node: be.reachable ? ticksText(be.ticks) : '--' });

// 對話框關閉後，把焦點交還給開啟它的頁首按鈕（選單項目已卸載）
function restoreFocus(selector) {
  window.setTimeout(() => {
    const el = document.querySelector(selector);
    if (el) { try { el.focus({ preventScroll: true }); } catch (e) { /* 忽略 */ } }
  }, 0);
}

function ConfirmDialog({ title, message, confirmLabel, onCancel, onConfirm }) {
  const cancelRef = useRef(null);
  const boxRef = useRef(null);
  useEffect(() => {
    if (cancelRef.current) cancelRef.current.focus();
    return () => restoreFocus('[aria-label="更多選項"]');
  }, []);
  const onKey = (e) => {
    if (e.key === 'Escape') { e.preventDefault(); onCancel(); return; }
    if (e.key === 'Tab' && boxRef.current) {
      const f = boxRef.current.querySelectorAll('button');
      const first = f[0];
      const last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  };
  return (
    <div className="scrim" onClick={(e) => { if (e.target === e.currentTarget) onCancel(); }}>
      <div className="sheet" role="alertdialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-desc" ref={boxRef} onKeyDown={onKey}>
        <h2 id="dlg-title" className="headline">{title}</h2>
        <p id="dlg-desc" className="footnote mt-2">{message}</p>
        <div className="sheet-actions">
          <button type="button" ref={cancelRef} className="btn btn-gray press" onClick={onCancel}>取消</button>
          <button type="button" className="btn btn-danger press" onClick={onConfirm}>{confirmLabel}</button>
        </div>
      </div>
    </div>
  );
}

function CopySheet({ text, onClose }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (el) { try { el.focus({ preventScroll: true }); el.select(); } catch (e) { /* 忽略 */ } }
    return () => restoreFocus('[aria-label="分享試算結果"]');
  }, []);
  return (
    <div className="scrim" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="sheet" role="dialog" aria-modal="true" aria-labelledby="copy-title" onKeyDown={(e) => { if (e.key === 'Escape') onClose(); }}>
        <h2 id="copy-title" className="headline">複製試算摘要</h2>
        <p className="footnote mt-2">無法自動複製，請全選下方文字後手動複製。</p>
        <textarea ref={ref} className="copy-box" readOnly value={text} aria-label="試算摘要文字" />
        <div className="mt-4"><button type="button" className="btn btn-gray press w-full" onClick={onClose}>完成</button></div>
      </div>
    </div>
  );
}

// ── App ──────────────────────────────────────────────────────────────
function App() {
  const initRef = useRef(null);
  if (!initRef.current) initRef.current = loadInitial();
  const init = initRef.current;
  const [inputs, setInputs] = useState(init.inputs);
  const [ui, setUi] = useState(init.ui);
  const [dismissed, setDismissed] = useState(init.dismissed);
  const [shared, setShared] = useState(init.shared);
  const [ladderExt, setLadderExt] = useState({ up: LADDER_DEFAULT, down: LADDER_DEFAULT });
  const [toast, setToast] = useState(null);
  const [announce, setAnnounce] = useState('');
  const [statusMsg, setStatusMsg] = useState('');
  const [confirmReset, setConfirmReset] = useState(false);
  const [copyFallback, setCopyFallback] = useState(null);
  const [scrolled, setScrolled] = useState(false);
  const [summaryInView, setSummaryInView] = useState(false);
  const isDesktop = useMedia('(min-width: 1024px)');
  const titleRef = useRef(null);
  const summaryRef = useRef(null);
  const toastTimer = useRef(0);

  // 持久化（每次變更即寫入；讀寫皆 try/catch）。分享連結橫幅未處理前，連同原設定（shared.backup）一起保存
  useEffect(() => {
    writeStore(shared ? { v: 2, inputs, ui, dismissed, shared: { backup: shared.backup } } : { v: 2, inputs, ui, dismissed });
  }, [inputs, ui, dismissed, shared]);

  // 分享連結：套用後移除 hash（之後一般操作不改 hash）；已開啟時再貼上分享連結（只改 hash）也會套用
  const inputsRef = useRef(inputs);
  inputsRef.current = inputs;
  useEffect(() => {
    try { performance.mark('tw:app-mounted'); } catch (e) { /* 忽略 */ }
    const clearHash = () => {
      try { window.history.replaceState(null, '', window.location.pathname + window.location.search); } catch (e) { /* 忽略 */ }
    };
    if (init.shared) clearHash();
    const onHash = () => {
      const h = parseHash(window.location.hash);
      if (!h) return;
      const current = inputsRef.current;
      setShared((s) => s || { backup: current }); // 連續套用多條連結時保留「最初」的設定
      setInputs(Object.assign({}, DEFAULTS, h));
      clearHash();
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  // 大標題捲出頁首後，頁首改為玻璃材質並顯示小標題
  useEffect(() => {
    const el = titleRef.current;
    if (!el || !('IntersectionObserver' in window)) return undefined;
    const io = new IntersectionObserver((entries) => { setScrolled(!entries[0].isIntersecting); }, { rootMargin: '-56px 0px 0px 0px' });
    io.observe(el);
    return () => io.disconnect();
  }, []);

  // 台北「今日」：跨過午夜或 App 回到前景時更新（iOS 主畫面 App 從背景恢復不會重新載入）。
  // 交易日期空白＝今日；計算與所有「今日」、依日期的提示都使用這個值。
  const [today, setToday] = useState(() => T.todayTaipei());
  useEffect(() => {
    const DAY = 86400000;
    const refresh = () => setToday(T.todayTaipei());
    const onVis = () => { if (document.visibilityState === 'visible') refresh(); };
    let timer = 0;
    const arm = () => {
      // 下一個台北午夜（UTC+8，台灣無日光節約時間）；多等 0.5 秒避免計時器提早觸發
      const ms = DAY - ((Date.now() + 8 * 3600000) % DAY) + 500;
      timer = window.setTimeout(() => { refresh(); arm(); }, ms);
    };
    arm();
    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('focus', refresh);
    window.addEventListener('pageshow', refresh);
    return () => {
      window.clearTimeout(timer);
      document.removeEventListener('visibilitychange', onVis);
      window.removeEventListener('focus', refresh);
      window.removeEventListener('pageshow', refresh);
    };
  }, []);

  const mode = T.MODES[inputs.tradeMode] || T.MODES.marginLong;
  const direction = mode.directions.indexOf(inputs.direction) >= 0 ? inputs.direction : mode.directions[0];
  const calcInputs = useMemo(() => Object.assign({}, inputs, { direction, tradeDate: isBlank(inputs.tradeDate) ? today : inputs.tradeDate }), [inputs, direction, today]);
  const result = useMemo(() => T.calculate(calcInputs), [calcInputs]);
  const isEmpty = !result.ok && result.errors.length === 1 && result.errors[0].code === 'ENTRY_PRICE_REQUIRED';

  const setField = useCallback((key, value) => {
    setInputs((prev) => (prev[key] === value ? prev : Object.assign({}, prev, { [key]: value })));
  }, []);
  const msgs = useMemo(() => buildFieldMsgs(result, setField), [result, setField]);
  // 有結果時用引擎實際採用的稅率（融資依出場日判斷）；否則依交易日期預估
  const taxInfo = useMemo(() => (result.ok ? result.tax : T.resolveTaxRate({
    productType: inputs.productType, tradeMode: inputs.tradeMode,
    tradeDate: calcInputs.tradeDate, taxRateOverride: inputs.taxRateOverride,
  })), [result, inputs.productType, inputs.tradeMode, calcInputs.tradeDate, inputs.taxRateOverride]);

  const showToast = useCallback((text, icon) => {
    window.clearTimeout(toastTimer.current);
    setToast({ text, icon: icon || 'check', id: Date.now() });
    setStatusMsg((prev) => (prev === text ? text + '​' : text));
    toastTimer.current = window.setTimeout(() => setToast(null), 2400);
  }, []);
  useEffect(() => () => window.clearTimeout(toastTimer.current), []);

  // 螢幕閱讀器：結果摘要（延遲播報，避免逐字打斷）
  const liveText = useMemo(() => {
    if (!result.ok) return '';
    const be = result.breakEven;
    let s = be.reachable ? '兩平價 ' + priceText(be.exitPrice) + '，' + ticksText(be.ticks) : '兩平價無法達成';
    if (result.manualExit) s += '。出場 ' + priceText(result.manualExit.exitPrice) + '，淨損益 ' + smoney(result.manualExit.profit) + ' 元，' + result.entry.returnRateLabel + ' ' + pct(result.manualExit.returnRate, true);
    if (result.entry.marginCallPrice != null) s += '。追繳價 ' + priceText(result.entry.marginCallPrice);
    return s;
  }, [result]);
  useEffect(() => {
    const id = window.setTimeout(() => setAnnounce(liveText), 800);
    return () => window.clearTimeout(id);
  }, [liveText]);

  // 摘要卡在畫面上時隱藏底部摘要列
  useEffect(() => {
    const el = summaryRef.current;
    if (!el || !('IntersectionObserver' in window)) { setSummaryInView(false); return undefined; }
    const io = new IntersectionObserver((entries) => setSummaryInView(entries[0].isIntersecting), { threshold: 0.25 });
    io.observe(el);
    return () => io.disconnect();
  }, [result.ok]);

  const stepPrice = (key, d) => {
    const pt = inputs.productType;
    let base = T.parseNumber(inputs[key]);
    if (base == null || !(base > 0)) {
      if (key !== 'exitPrice') return;
      base = result.ok ? result.entryPrice : T.parseNumber(inputs.entryPrice);
      if (base == null || !(base > 0)) return;
    }
    const next = T.addTick(base, d, pt);
    // 往下到不了：已是最低價；往上超過價格上限（或原值已超出可處理範圍）：已達價格上限
    if (next == null || (d > 0 && next > RULES.priceMax)) {
      showToast(d < 0 && base <= 0.01 ? '已是最低價 0.01' : '已達價格上限 ' + intText(RULES.priceMax) + ' 元', 'warn');
      return;
    }
    setField(key, fmtInputPrice(next));
  };
  const stepLots = (d) => {
    const cur = T.parseNumber(inputs.lots);
    const n = cur != null && cur >= 1 ? Math.round(cur) : (d > 0 ? 0 : 1);
    setField('lots', String(Math.min(100000, Math.max(1, n + d))));
  };
  const applyExit = (p) => {
    setField('exitPrice', fmtInputPrice(p));
    showToast('已帶入出場價 ' + priceText(p));
  };
  const toggleOpen = (k) => setUi((u) => Object.assign({}, u, { open: Object.assign({}, u.open, { [k]: !u.open[k] }) }));
  const setTab = (t) => setUi((u) => Object.assign({}, u, { tab: t }));

  const jumpTo = (id, focus) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: 'start' });
    if (focus) { try { focus.focus({ preventScroll: true }); } catch (e) { /* 忽略 */ } }
  };
  const onJumpResults = () => jumpTo('results-title', document.getElementById('results-title'));
  const onAbout = () => {
    setUi((u) => Object.assign({}, u, { open: Object.assign({}, u.open, { about: true }) }));
    window.setTimeout(() => jumpTo('about-btn', document.getElementById('about-btn')), 30);
  };
  const onEditTargets = () => {
    setUi((u) => Object.assign({}, u, { open: Object.assign({}, u.open, { advanced: true }) }));
    window.setTimeout(() => {
      const el = document.getElementById('f-targets');
      if (el) { el.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: 'center' }); try { el.focus({ preventScroll: true }); } catch (e) { /* 忽略 */ } }
    }, 30);
  };
  const doReset = () => {
    setInputs(T.getDefaults());
    setLadderExt({ up: LADDER_DEFAULT, down: LADDER_DEFAULT });
    setShared(null);
    setConfirmReset(false);
    showToast('已重設為預設值');
  };

  const onShare = () => {
    if (!result.ok && isEmpty) { showToast('請先輸入進場價', 'warn'); return; }
    // 分享連結一律帶實際使用的交易日期（td），收件者在其他日期開啟也能得到相同結果
    const shareInputs = Object.assign({}, calcInputs, { tradeDate: result.ok ? result.tradeDate : calcInputs.tradeDate });
    const text = buildShareText(result, shareInputs);
    const isHttp = window.location.protocol === 'http:' || window.location.protocol === 'https:';
    const url = isHttp ? window.location.origin + window.location.pathname + buildHash(shareInputs) : '';
    const full = url ? text + '\n' + url : text;
    const fallback = () => {
      copyText(full).then((ok) => {
        if (ok) showToast('已複製試算摘要', 'copy');
        else { setCopyFallback(full); showToast('無法自動複製，請手動複製', 'warn'); }
      });
    };
    if (isHttp && navigator.share) {
      let p;
      try { p = navigator.share({ title: '台股當沖・融資融券計算機', text, url }); } catch (err) { fallback(); return; }
      if (p && p.then) p.then(() => {}, (err) => { if (!err || err.name !== 'AbortError') fallback(); });
      return;
    }
    fallback();
  };

  const showA2HS = IS_IOS && !IS_STANDALONE && !dismissed.a2hs;
  const isCredit = mode.credit;
  const status = result.ok ? 'ok' : isEmpty ? 'empty' : 'error';
  const tabOptions = [{ value: 'details', label: '明細' }, { value: 'targets', label: '目標價' }, { value: 'ladder', label: '價格階梯' }];

  const detailCards = result.ok ? (
    <div className="space-y-3">
      <div className="grid gap-3 xl:grid-cols-2 items-start">
        <EntryCard r={result} />
        <ExitCard r={result} />
      </div>
      <ConditionsCard r={result} today={today} />
    </div>
  ) : null;

  return (
    <div className="shell">
      <HapticSwitch />
      <Header scrolled={scrolled} onShare={onShare} onReset={() => setConfirmReset(true)} onAbout={onAbout} />
      <main className="gutter page-bottom mx-auto w-full max-w-[1280px]">
        <div className="pt-1 pb-4 lg:pb-6" ref={titleRef}>
          <h1 className="large-title">台股當沖・融資融券計算機</h1>
          <p className="subtitle"><Parts parts={['手續費、證交稅、利息、兩平價與追繳價', '依台股規則逐檔試算']} sep="，" /></p>
        </div>
        <div className="grid grid-cols-1 gap-3 lg:grid-cols-[400px_minmax(0,1fr)] lg:gap-6 items-start">
          <div className="input-col min-w-0 space-y-3 lg:sticky lg:top-4 lg:self-start lg:max-h-[calc(100dvh-2rem)] lg:overflow-auto">
            {shared ? (
              <div className="card card-pad" role="status">
                <p className="headline">已套用分享連結的試算</p>
                <p className="footnote mt-1">欄位已換成連結中的設定，你原本的設定已暫存。</p>
                <div className="flex flex-wrap gap-2 mt-3">
                  <button type="button" className="btn btn-gray press" onClick={(e) => { setInputs(shared.backup); setShared(null); showToast('已還原你的設定'); keepFocus(e, 'sec-trade'); }}>還原我的設定</button>
                  <button type="button" className="btn btn-tinted press" onClick={(e) => { setShared(null); keepFocus(e, 'sec-trade'); }}>保留連結設定</button>
                </div>
              </div>
            ) : null}
            <TradeCard inputs={inputs} direction={direction} setField={setField} msgs={msgs} taxInfo={taxInfo} />
            <PriceCard inputs={inputs} setField={setField} result={result} msgs={msgs} onStepPrice={stepPrice} onStepLots={stepLots} />
            <FeeSection inputs={inputs} setField={setField} result={result} msgs={msgs} open={ui.open.fees} onToggle={() => toggleOpen('fees')} />
            {isCredit ? <CreditSection inputs={inputs} setField={setField} result={result} msgs={msgs} open={ui.open.credit} onToggle={() => toggleOpen('credit')} today={today} /> : null}
            <AdvancedSection inputs={inputs} setField={setField} result={result} msgs={msgs} open={ui.open.advanced} onToggle={() => toggleOpen('advanced')} today={today} />
          </div>

          <section className="min-w-0 space-y-3" aria-labelledby="results-title">
            <h2 id="results-title" tabIndex={-1} className="title2 px-1 pt-3 lg:pt-0">試算結果</h2>
            {status === 'empty' ? (
              <div className="card card-pad" data-testid="empty">
                <p className="headline">輸入進場價即可看到結果</p>
                <p className="footnote mt-2">選好交易類型與商品後，輸入進場價與張數；兩平價、追繳價、目標價與價格階梯會立即計算。</p>
              </div>
            ) : null}
            {status === 'error' ? (
              <div className="card card-pad" role="alert" data-testid="error">
                <p className="headline c-danger flex items-center gap-2"><Icon name="error" />無法計算</p>
                <ul className="mt-2 space-y-1">{result.errors.map((er) => <li key={er.code} className="footnote">{er.message}</li>)}</ul>
              </div>
            ) : null}
            {status === 'ok' ? (
              <div className="space-y-3" data-testid="results">
                <SummaryCard r={result} cardRef={summaryRef} />
                <NotesBlock r={result} />
                {isDesktop ? (
                  <div className="space-y-3">
                    {detailCards}
                    <TargetsCard r={result} onApplyExit={applyExit} onEditTargets={onEditTargets} />
                    <LadderCard r={result} ext={ladderExt} setExt={setLadderExt} onApplyExit={applyExit} />
                  </div>
                ) : (
                  <div className="space-y-3">
                    <Segmented idBase="tabs" variant="tabs" ariaLabel="結果分頁" value={ui.tab} options={tabOptions} onChange={setTab} />
                    <div id="tabs-panel" role="tabpanel" aria-labelledby={'tabs-' + ui.tab} className="tab-panel" key={ui.tab}>
                      {ui.tab === 'details' ? detailCards : null}
                      {ui.tab === 'targets' ? <TargetsCard r={result} onApplyExit={applyExit} onEditTargets={onEditTargets} /> : null}
                      {ui.tab === 'ladder' ? <LadderCard r={result} ext={ladderExt} setExt={setLadderExt} onApplyExit={applyExit} /> : null}
                    </div>
                  </div>
                )}
              </div>
            ) : null}
            {showA2HS ? (
              <div className="card card-pad flex gap-3 items-start">
                <span className="icon-btn" aria-hidden="true"><Icon name="home" /></span>
                <div className="min-w-0 flex-1">
                  <p className="headline">加入主畫面，像 App 一樣使用</p>
                  <p className="footnote mt-1">在 Safari 點「分享」→「加入主畫面」。iOS 26 起會以 App 模式開啟；開啟過一次後可離線使用。主畫面 App 的設定與 Safari 分開保存。</p>
                  <button type="button" className="btn btn-gray btn-sm press mt-3" onClick={(e) => { setDismissed((d) => Object.assign({}, d, { a2hs: true })); keepFocus(e, 'about-btn'); }}>知道了</button>
                </div>
              </div>
            ) : null}
            <About open={ui.open.about} onToggle={() => toggleOpen('about')} />
          </section>
        </div>
      </main>

      {status === 'ok' && !isDesktop && !summaryInView ? <SummaryBar r={result} onJump={onJumpResults} /> : null}
      {toast ? (
        <div className="toast-wrap" aria-hidden="true">
          <div className="toast" key={toast.id} data-testid="toast"><Icon name={toast.icon} size={18} />{toast.text}</div>
        </div>
      ) : null}
      <p className="sr-only" role="status" aria-live="polite">{statusMsg}</p>
      <p className="sr-only" aria-live="polite" data-testid="live">{announce}</p>
      {confirmReset ? (
        <ConfirmDialog title="重設為預設值？" message="會清除進場價、出場價、停損與所有費用、信用與進階設定，恢復預設值。此動作無法復原。"
          confirmLabel="重設" onCancel={() => setConfirmReset(false)} onConfirm={doReset} />
      ) : null}
      {copyFallback ? <CopySheet text={copyFallback} onClose={() => setCopyFallback(null)} /> : null}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { failed: false };
  }
  static getDerivedStateFromError() {
    return { failed: true };
  }
  render() {
    if (!this.state.failed) return this.props.children;
    return (
      <div className="boot">
        <p className="boot-title">發生錯誤</p>
        <p className="boot-msg">畫面發生未預期的錯誤。可重設儲存的設定後重新載入。</p>
        <button type="button" className="btn btn-filled press" onClick={() => { try { window.localStorage.removeItem(STORE_KEY); } catch (e) { /* 忽略 */ } window.location.reload(); }}>重設並重新載入</button>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
<script>
  (function () {
    function bootMessage(text, failed) {
      var el = document.getElementById('boot-msg');
      if (!el) return;
      el.textContent = text;
      if (!failed || !el.parentNode) return;
      el.parentNode.className += ' is-failed';
      if (!document.getElementById('boot-retry')) {
        var b = document.createElement('button');
        b.type = 'button';
        b.id = 'boot-retry';
        b.className = 'btn btn-filled press';
        b.textContent = '重新載入';
        b.addEventListener('click', function () { location.reload(); });
        el.parentNode.appendChild(b);
      }
    }
    // CDN 自我修復：Service Worker 快取的 CDN 若意外是錯誤回應（例如 Tailwind 沒有 CORS，只能存無法驗證狀態的 opaque），
    // 對應的全域物件會缺失。此時請 SW 清除那幾筆快取並重新載入一次；同一分頁只嘗試一次，避免離線時無限重載。
    var CDN_GLOBALS = [['/react@', 'React'], ['/react-dom@', 'ReactDOM'], ['/@babel/standalone@', 'Babel'], ['cdn.tailwindcss.com', 'tailwind']];
    var HEAL_KEY = 'twcalc:cdn-heal';
    function failedCdnUrls() {
      var failed = [];
      Array.prototype.forEach.call(document.querySelectorAll('script[src^="https://"]'), function (s) {
        for (var i = 0; i < CDN_GLOBALS.length; i++) {
          if (s.src.indexOf(CDN_GLOBALS[i][0]) !== -1 && !window[CDN_GLOBALS[i][1]]) failed.push(s.src);
        }
      });
      return failed;
    }
    function healCdn(urls) {
      var ctrl = navigator.serviceWorker && navigator.serviceWorker.controller;
      if (!ctrl || !urls.length || navigator.onLine === false || typeof MessageChannel === 'undefined') return false;
      try {
        if (sessionStorage.getItem(HEAL_KEY)) return false;
        sessionStorage.setItem(HEAL_KEY, '1');
      } catch (e) { return false; }
      var done = false;
      var reload = function () { if (!done) { done = true; location.reload(); } };
      var channel = new MessageChannel();
      channel.port1.onmessage = reload;
      try { ctrl.postMessage({ type: 'CDN_PURGE', urls: urls }, [channel.port2]); } catch (e) { return false; }
      window.setTimeout(reload, 1500);
      return true;
    }
    // CDN 載入失敗（離線且尚未快取）時提示
    window.addEventListener('load', function () {
      var failedCdn = failedCdnUrls();
      if (failedCdn.length && healCdn(failedCdn)) return; // 即將重新載入
      if (!failedCdn.length) { try { sessionStorage.removeItem(HEAL_KEY); } catch (e) { /* 忽略 */ } }
      if (!window.React || !window.ReactDOM || !window.Babel) {
        bootMessage('需要網路連線載入元件（加入主畫面並開啟過一次後可離線使用）', true);
        return;
      }
      window.setTimeout(function () {
        if (document.getElementById('boot-msg')) bootMessage('載入時間較長；若持續未顯示，請重新整理頁面。', true);
      }, 8000);
    });
    // 主畫面 App：要求持久化儲存（避免設定被清除）
    var standalone = false;
    try { standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches); } catch (e) { /* 忽略 */ }
    if (standalone) {
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) { /* 忽略 */ }
    }
    // Service Worker：只在 http/https 註冊（file:// 直接開啟時略過）
    if ((location.protocol === 'http:' || location.protocol === 'https:') && 'serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () { /* 註冊失敗不影響計算 */ });
      });
    }
  })();
</script>
